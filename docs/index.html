<title>Instagram Reel Research Tool（美容ビジネス ver）</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@600;900&family=Roboto+Mono:wght@400;500;700&display=swap">
<style>
  /* 明るい側を基準に全トークンを定義する。暗い側は下で上書きする。 */
  :root {
    --bg: #f6f4f5;
    --surface: #ffffff;
    --surface-2: #fbf9fa;
    --ink: #231c22;
    --muted: #6f636c;
    --border: #e4dee2;
    --accent: #8b2f5f;
    --accent-soft: #f7e9f0;
    --rising: #0f7b6c;
    --rising-soft: #e2f2ef;
    --chip: #efeaed;
    --focus: #8b2f5f;
  }
  /* OS が暗いとき。ただし閲覧者が明るいテーマを選んでいたらそちらを優先する。 */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #151114;
      --surface: #1f1a1e;
      --surface-2: #241e23;
      --ink: #f0eaee;
      --muted: #a3969e;
      --border: #332b31;
      --accent: #e086b0;
      --accent-soft: #3a2130;
      --rising: #4fc3ae;
      --rising-soft: #16332e;
      --chip: #2c2429;
      --focus: #e086b0;
    }
  }
  /* 閲覧者が暗いテーマを選んだとき。OS の設定に関係なく効かせる。 */
  :root[data-theme="dark"] {
    --bg: #151114;
    --surface: #1f1a1e;
    --surface-2: #241e23;
    --ink: #f0eaee;
    --muted: #a3969e;
    --border: #332b31;
    --accent: #e086b0;
    --accent-soft: #3a2130;
    --rising: #4fc3ae;
    --rising-soft: #16332e;
    --chip: #2c2429;
    --focus: #e086b0;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    /* 透明のままだと閲覧側の地の色を借りてしまうので必ず塗る */
    background: var(--bg);
    color: var(--ink);
    /* 日本語本文はWebフォントを落とすと重いので、端末のフォントを使う */
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP",
                 -apple-system, BlinkMacSystemFont, "Yu Gothic Medium", sans-serif;
    line-height: 1.75;
    font-feature-settings: "palt" 1;
    word-break: normal;
    overflow-wrap: break-word;
    line-break: strict;
  }

  .wrap { max-width: 880px; margin: 0 auto; padding: 40px 20px 96px; }

  :focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
    border-radius: 4px;
  }

  /* --- 見出し --- */
  h1 {
    font-family: "Zen Old Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
    font-weight: 900;
    font-size: clamp(1.5rem, 4vw, 2.1rem);
    line-height: 1.35;
    letter-spacing: .01em;
    margin: 0;
    text-wrap: balance;
  }
  /* 対象ジャンルの但し書き。名前より一段弱く見せる */
  .ver {
    display: block;
    font-family: "Hiragino Sans", "Noto Sans JP", sans-serif;
    font-weight: 400;
    font-size: .74rem;
    letter-spacing: .02em;
    color: var(--muted);
    margin-top: 6px;
  }

  /* --- 集計：詳細より先に全体像を出す --- */
  .panel {
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    background: var(--surface);
    margin: 28px 0 8px;
  }
  /* 4枚で固定する。auto-fit だと枚数によって最後の1枚だけ次の行に
     取り残され、空いた枠が塗り残しに見えてしまうため。 */
  .summary {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1px;
    background: var(--border);
  }
  @media (max-width: 620px) {
    /* 4枚なので2列でもきれいに埋まる */
    .summary { grid-template-columns: repeat(2, 1fr); }
  }
  .stat { background: var(--surface); padding: 14px 16px; }

  /* --- ジャンル別の内訳 --- */
  /* 棒にしておけば、ジャンルが何個あっても1行1本で並ぶので取り残しが出ない */
  .breakdown { padding: 15px 16px 17px; border-top: 1px solid var(--border); }
  .breakdown-title {
    font-size: .7rem; color: var(--muted); letter-spacing: .06em;
    margin: 0 0 11px; white-space: nowrap;
  }
  /* 名前の列は固定幅。名前に合わせて伸ばすと、長いジャンルの行だけ棒の
     開始位置がずれて、棒どうしの長さを目で比べられなくなる。
     収まらない名前は「・」の位置で折る（折り位置は .nb で決め打ち）。
     幅と高さは実際のジャンル名から build_html.py が計算して埋める。 */
  .bar-row {
    display: grid;
    grid-template-columns: 11.5em 1fr auto;
    gap: 12px; align-items: center;
  }
  .bar-row + .bar-row { margin-top: 8px; }
  /* 1行で収まる名前も2行の名前と同じ高さにする。混ざると行の間隔が
     ばらついて、棒の並びが読みにくくなる。
     flex にしているのは、折り返した2行をまとめて上下中央に置くため。 */
  .bar-name {
    font-size: .76rem; line-height: 1.4;
    min-height: 1.4em;
    display: flex; flex-wrap: wrap; align-content: center;
  }
  .bar-track {
    height: 6px; border-radius: 999px;
    background: var(--chip); overflow: hidden;
  }
  .bar-fill { height: 100%; border-radius: 999px; background: var(--accent); }
  .bar-count {
    font-family: "Roboto Mono", ui-monospace, monospace;
    font-size: .74rem; color: var(--muted);
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  @media (max-width: 620px) {
    /* 幅は変えない。変えると狭い画面だけ折り返し位置が変わってしまう */
    .bar-row { gap: 9px; }
  }
  /* まだ集まっていないジャンル。対象には入っているので消さず、弱く見せる */
  .bar-row.pending .bar-name { color: var(--muted); }
  .bar-row.pending .bar-track { opacity: .55; }
  /* 「収集待ち」は日本語なので、等幅フォントに任せず本文と同じ書体で出す */
  .bar-row.pending .bar-count {
    font-family: "Hiragino Sans", "Noto Sans JP", sans-serif;
    font-size: .7rem;
  }
  .stat-label {
    font-size: .7rem; color: var(--muted); letter-spacing: .06em;
    display: block; margin-bottom: 4px;
    /* 「表示中/の投稿」のように助詞で割れないよう、まとめて扱う */
    white-space: nowrap;
  }
  .stat-value {
    white-space: nowrap;
    font-family: "Roboto Mono", ui-monospace, monospace;
    font-size: 1.25rem; font-weight: 700;
    font-variant-numeric: tabular-nums;
    line-height: 1.2;
  }
  .stat-value .unit { font-size: .72rem; font-weight: 400; color: var(--muted); margin-left: 3px; }
  .stamp {
    font-family: "Roboto Mono", ui-monospace, monospace;
    font-size: .7rem; color: var(--muted); margin: 0 0 26px;
  }

  /* --- 操作バー --- */
  .controls {
    position: sticky; top: 0; z-index: 10;
    background: var(--bg);
    padding: 12px 0 14px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 18px;
  }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .row + .row { margin-top: 8px; }
  select, input[type=search] {
    font: inherit; font-size: .82rem;
    padding: 7px 11px;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: var(--surface);
    color: var(--ink);
  }
  input[type=search] { flex: 1; min-width: 180px; }
  .chip {
    display: inline-flex; align-items: baseline; gap: 6px;
    font-size: .78rem; padding: 5px 13px;
    border: 1px solid var(--border); border-radius: 999px;
    background: var(--surface); color: var(--muted);
    cursor: pointer; user-select: none;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  .chip.on {
    background: var(--accent-soft); border-color: var(--accent);
    color: var(--accent); font-weight: 700;
  }
  /* どちらの行を押しているのか分かるようにする。2段になると迷いやすい */
  .filter-label {
    font-size: .7rem; color: var(--muted); letter-spacing: .04em;
    white-space: nowrap; min-width: 5.5em;
  }
  /* ジャンル名は途中で割らない。「ダイエット」を「ダイ」と「エット」に分けない */
  .chip-name { white-space: nowrap; }
  /* まだ1件も無いジャンル。押しても空振りするので、選べないことを見た目で示す */
  .chip.pending {
    opacity: .45; cursor: default;
    border-style: dashed;
  }
  .chip.pending:hover { border-color: var(--border); color: var(--muted); }
  .count {
    white-space: nowrap;
    font-family: "Roboto Mono", ui-monospace, monospace;
    color: var(--muted); font-size: .76rem; margin-bottom: 14px;
    font-variant-numeric: tabular-nums;
  }

  /* --- カード --- */
  #list { display: flex; flex-direction: column; gap: 10px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid transparent;
    border-radius: 10px;
    padding: 16px 18px;
  }
  /* 伸びが速い投稿は左端の色で一目で分かるようにする */
  .card.rising { border-left-color: var(--rising); background: var(--surface-2); }

  .card-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 9px; }
  .rank {
    font-family: "Roboto Mono", ui-monospace, monospace;
    font-size: .74rem; color: var(--muted);
    font-variant-numeric: tabular-nums; min-width: 2.4em;
  }
  .user { font-weight: 700; font-size: .86rem; }
  .badge {
    white-space: nowrap;
    font-size: .66rem; font-weight: 700; letter-spacing: .04em;
    padding: 2px 8px; border-radius: 999px;
    background: var(--rising-soft); color: var(--rising);
  }
  .stats {
    margin-left: auto; display: flex; gap: 11px;
    font-family: "Roboto Mono", ui-monospace, monospace;
    font-size: .74rem; font-variant-numeric: tabular-nums;
  }
  /* 数字と単位を離さない。「120,000」と「再生」が割れると読めなくなる */
  .likes { color: var(--accent); font-weight: 700; white-space: nowrap; }
  /* 再生・いいね・コメント・フォロワー。数字と単位を離さない */
  .metrics {
    display: flex; flex-wrap: wrap; gap: 12px;
    font-size: .74rem; color: var(--muted); margin: 0 0 8px;
    font-variant-numeric: tabular-nums;
  }
  .metric { white-space: nowrap; }
  .vel { color: var(--rising); font-weight: 500; white-space: nowrap; }
  .age { color: var(--muted); white-space: nowrap; }

  .text {
    white-space: pre-wrap;
    /* word-break: break-word は単語の途中で割るので使わない。
       overflow-wrap なら、1語が行に収まらないときだけ割る。
       line-break: strict で日本語の禁則処理を厳しい方に寄せる。 */
    word-break: normal;
    overflow-wrap: break-word;
    line-break: strict;
    font-size: .92rem; margin: 0 0 12px;
  }

  /* 文節のかたまり。ここで囲った範囲は途中で改行されない。
     「を」「と」などの助詞が行頭に来るのを防ぐために使う。 */
  .nb { white-space: nowrap; }

  .tags { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .tag {
    white-space: nowrap;
    font-size: .7rem; padding: 3px 9px; border-radius: 4px;
    background: var(--chip); color: var(--muted);
  }
  .link {
    margin-left: auto; font-size: .76rem; color: var(--accent);
    text-decoration: none; font-weight: 700; white-space: nowrap;
  }
  .link:hover { text-decoration: underline; }

  .empty { text-align: center; color: var(--muted); padding: 64px 20px; font-size: .88rem; }
</style>

節がスムーズに動かなくなって、特に朝方に指が曲がりにくくなったり痛んだりするよ💦\n\n​3. ドライアイや口の渇きがひどい\n実は目や口、肌に潤いを与えているのもエストロゲン。分泌が減ると全身の粘膜の水分キープ力が一気に落ちるから、目がゴロゴロしたり口が渇きやすくなったりするの😢\n\n​4. 髪がパサつく・抜け毛が増える\n髪のツヤやハリ、成長を支えてくれているのも女性ホルモン。これが減ると髪が細くなったり、頭頂部を中心に全体的な抜け毛が増えたりする原因になるよ。\n\n​5. なぜか皮膚がかゆい\nホルモンが減るとお肌のバリア機能が低下。乾燥のせいで、衣類の擦れとか普段ならなんてことない刺激にもお肌が過敏になって、背中や頭皮が痒くなることがあるの。\n\n​6. 理由もないのに強い不安感に襲われる\nエストロゲンは心の安定を保つ「セロトニン」を作ってくれているの。ホルモンが激減するとセロトニンも減るから、理由がないのに急に不安や焦りが爆発することもあるよ💦\n\n​7. 匂いに敏感・自分の体臭が気になる\n自律神経の乱れから嗅覚が過敏になって、匂いに敏感になる人が多いの。あとはホットフラッシュのベタついた汗のせいで、実際に体臭が変わりやすい時期でもあるよ。\n\n​8. トイレの回数が増える（頻尿・尿もれ）\n尿道や骨盤の筋肉をしなやかに保つ力が弱まるから、筋肉が萎縮して硬くなるの。急に強い尿意を感じたり、くしゃみをした拍子にヒヤッとしたりしやすくなるよ。\n\n​9. ぐっすり寝たはずなのに昼間に猛烈な眠気\n夜中に自覚のないほてりや発汗が起きて、睡眠の質が下がっているケースがすごく多いの。脳が休めていないから、日中に耐えがたい眠気がきちゃうんだ🥱\n\n​10. かかとのガサガサが治らない\nお肌の乾燥＆生まれ変わりのサイクルが遅くなるのが原因。特に皮脂腺のないかかとは角質がどんどん硬くなって、クリームを塗ってもひび割れが治りにくくなるよ。\n\n​11. 悲しくないのに涙もろくなる\n脳の視床下部は、ホルモンの司令塔であり感情のコントロールセンター。卵巣の機能が落ちて脳がパニックを起こすから、感情のブレーキが利かなくて涙が出やすくなるの。\n\n​12. 生理の周期が短くなる\n閉経に近づくと、脳が「ホルモン出して！」って焦って卵胞を急いで育ててしまうの。だから周期が遅れるより先に「21〜25日周期」に早まる人が実は多いんだよ💡\n\n​\n​大人の第2章、もっと身軽に楽しもう！✨\n​これらの症状は、体が次の新しいステージへ\n行くために一生懸命がんばっている証拠。\n\n自分を責めずに「私の体、お疲れ様」って\n労ってあげようね🌱\n\n​これからの変化に落ち着いて備えるために、\nまずは【保存】していつでも見返せるように\nしておいてね！\n\n✤··········✤··········✤··········✤··········✤··········✤········✤\nこんにちは😊\n\nこのアカウントでは\n【今日から変われる健康情報】\nを日々お届けしています。\n\nあなたの暮らしに役立つ情報が\n見つかりますように✨\n\n@yurutto_kenkou_life←他の投稿はこちらから\n\nいいね❤️コメント💬フォロー🤗\nとーっても励みになります!\n✤··········✤··········✤··········✤··········✤··········✤········✤\n​#閉経前サイン #更年期 #40代の悩み #プレ更年期 #女性の健康", "permalink": "https://www.instagram.com/reel/DZUbIguzksV/", "plays": 2431326, "likes": null, "comments": null, "followers": 13000, "ratio": 187.0, "ageHours": 2585.3, "postedAt": "2026-06-08T18:01:27+09:00", "timestampEstimated": true, "genres": ["更年期ケア"], "hashtags": ["更年期"], "mods": []}, {"id": "DcnrCoNPII0", "username": "naru.tensyoku", "text": "", "permalink": "https://www.instagram.com/reel/DcnrCoNPII0/", "plays": 525000, "likes": 435, "comments": 1, "followers": 28 stampEstimated": false, "genres": [], "hashtags": ["ネイルデザイン"], "mods": []}, {"id": "DaAMjsKpjpw", "username": "bishukan_mama", "text": "", "permalink": "https://www.instagram.com/reel/DaAMjsKpjpw/", "plays": 1225000, "likes": 1423, "comments": 40, "followers": 12000, "ratio": 102.1, "ageHours": 2177.3, "postedAt": "2026-06-25T18:00:40+09:00", "timestampEstimated": true, "genres": ["更年期ケア"], "hashtags": ["@bishukan_mama"], "mods": []}, {"id": "3967133474687103487", "username": "mike_healthylife", "text": "今日は「ほてりだけじゃない！更年期に起こる意外な症状10選」のお話 \n\n「更年期＝ほてり・汗」だけだと思っていませんか？\n\n実は更年期って、ほてり以外にも\n「えっ、これも？」と思うような症状が出ることがあります。\n\n☑ 朝、手をグーにしづらい\n☑ 舌がピリピリ・ヒリヒリする\n☑ 歯に異常がないのに痛む\n☑ 喉に何かが引っかかる感じ\n☑ 朝の一歩目でかかとが痛む\n☑ 匂いに敏感になる\n☑ 肌がかゆい・チクチクする\n☑ 味の感じ方が変わる\n☑ 普段の音がやけにうるさく感じる\n☑ 突然、心臓がドキドキする\n\n「これ、更年期と関係あるの？」って思った症状もあるかもしれません。\n\n更年期には、女性ホルモン「エストロゲン」が減ったり、大きく変動したりします。\n\nこのエストロゲンは、女性特有のことだけじゃなく、自律神経や関節、肌や粘膜など、全身のいろんな働きに関わっています。\n\nそのため、ほてりや汗だけじゃなく、関節のこわばりや肌のかゆみ、動悸など、いろんな不調が出ることも。\n\nただし⚠️\n今回紹介した症状は、更年期以外の原因で起こることもあります。\n\n「たぶん更年期だろう」と決めつけず、症状が強い・長く続くときは医療機関に相談してくださいね。\n\n「これ私にもあるかも…」と思ったら、あとで見返せるように保存しておいてね🔖\n………………………………………………………………………\nご覧いただきありがとうございます✨\nこのアカウント @mike_healthylife では\n知らないと損する健康知識を投稿してます✨ \n毎日がちょっと心地よくなるきっかけに\nなりますように♡\n………………………………………………………………………\n#更年期 #不調 #生活習慣 #健康生活", "permalink": "https://www.instagram.com/reel/DcOFuBfSTH_/", "plays": 1315218, "likes": null, "comments": null, "followers": 13000, "ratio": 101.2, "ageHours": 854.8, "postedAt": "2026-08-19T20:33:04+09:00", "timestampEstimated": true, "genres": ["更年期ケア"], "hashtags": ["更年期"], "mods": []}, {"id": "DcOFuBfSTH_", "username": "mike_healthylife", "text": "", "permalink": "https://www.instagram.com/reel/DcOFuBfSTH_/", "plays": 1315000, "likes": 1435, "comments": 38, "followers": 13000, "ratio": 101.2, "ageHours": 854.8, "postedAt": "2026-08-19T20:33:04+09:00", "timestampEstimated": true, "genres": ["更年期ケア"], "hashtags": ["@mike_healthylife"], "mods": []}, {"id": "3967047301570862275", "username": "est._mami", 起きたら白湯を飲み、手首や指先をやさしくグーパー運動。\n\n3．急に高所や運転が怖くなる ➡ 心と体のエネルギーが減り、不安を感じやすくなっているかも。\n 💡【対処法】無理をせず「今は省エネモード」と考え、早めの就寝を意識しましょう。\n\n4．足の裏がジリジリ熱い・ほてる ➡ 体のうるおいが不足し、熱がこもりやすくなっている状態かも。 \n💡【対処法】夜の足もみや、クコの実・黒ごま・黒豆などを取り入れて、体のうるおいを補いましょう。\n\n5．まぶたがピクピク痙攣する ➡ 疲れや睡眠不足が続き、体が休息を求めているサイン。 \n💡【対処法】寝る前はスマホを控え、温かい蒸しタオルで目元をゆっくり温めましょう。\n\n6．爪が割れやすい・縦すじが入る ➡ 栄養や血流が不足し、爪にまで影響が出始めているかも。 \n💡【対処法】胃腸にやさしい食事を心がけ、爪の保湿も忘れずに。\n\n7．抜け毛や白髪が急に増えた ➡ 年齢だけでなく、若々しさを支える力が低下しているサインかも。 \n💡【対処法】頭皮をやさしくマッサージし、黒豆やひじきなど黒い食材も意識してみましょう。\n\n8．かかとがガサガサに乾燥・ひび割れる ➡ 冷えとうるおい不足が進んでいるサイン。 \n💡【対処法】足首やお腹を温め、お風呂上がりはしっかり保湿しましょう。\n\n9．舌のふちに歯型がついている ➡ 胃腸が疲れ、余分な水分をため込みやすくなっている状態。 \n💡【対処法】冷たい飲み物を控え、温かいスープや温野菜で胃腸をいたわりましょう。\n\n10．夕方になると顔だけカッカと熱い ➡ 疲れがたまり、体に熱がこもりやすくなっているサイン。 \n💡【対処法】深呼吸をしながらゆっくり過ごし、夕方以降は無理をせずリラックスする時間をつくりましょう。\n\n✨ 「年齢のせいだから…」と我慢しないで\n\n40代からの不調は、体が一生懸命送ってくれているSOSサインかもしれません。\n\nまずは「最近こんなことあったな」と、\n自分の体の声に気づいてあげることがセルフケアの第一歩🌿\n\n当てはまる項目があった方は、ぜひコメントで番号を教えてください😊\n\nあとで見返せるように【保存】もお忘れなく🔖\n\n----------\n2児のアラフォーママ×鍼灸師🌿\n♢忙しくても体は整えられる\n♢東洋医学×ツボケアで回復しやすい身体づくり\n｢今も未来も、心地よく美しく生きたい｣女性へ✨\n----------\n\n#セルフケア #東洋医学 #インナービューティー #更年期 #養生", "permalink": "https://www.instagram.com/reel/DbLGehehBSp/", "plays": 415667, "likes": null, "comments": null, "followers": 5776, "ratio": 72.0, "ageHours": 1479.2, "postedAt": "2026-07-24T20:10:35+09:00", "timestampEstimated": true, "genres": ["更年期ケア"], "hashtags": ["更年期"], "mods": ["手技"]}, {"id": "DcIhSU2R7Ju", "username": "runa.k72", "text": "", "permalink": "https://www.instagram.com/reel/DcIhSU2R7Ju/", "plays": 929000, "likes": 3686, "comments": 17, "followers": 13000, "ratio": 71.5, "ageHours": null, "postedAt": "", "timestampEstimated": false, "genres": ["リンパ"], "hashtags": ["@runa.k72"], "mods": []}, {"id": "DcvVaztTlro", "username": "azusajinshan8", "text": "", "permalink": "https://www.instagram.com/reel/DcvVaztTlro/", "plays": 319000, "likes": 796, "comments": 14, "followers": 4603, "ratio": 69.3, "ageHours": 544.9, "postedAt": "2026-09-01T18:25:12+09:00", "timestampEstimated": true, "g aris Gina 🎀\nTokyo, Shibuya\n\n🌸 Maison Shibuya 3F\n1-12-18 Jinnan, Shibuya-ku\nTokyo 150-0041\n\n🫧 Reservations\n・DM welcome\n・Online booking available\n\n💗 soft pink space\n💗 relaxing head spa\n💗 for everyone\n\n#tokyo #shibuya #traveltok #headspa #ヘッドスパ", "permalink": "https://www.instagram.com/reel/DaetQKMSPW-/", "plays": 31166, "likes": null, "comments": null, "followers": 722, "ratio": 43.2, "ageHours": 1893.0, "postedAt": "2026-07-07T14:23:35+09:00", "timestampEstimated": true, "genres": ["ヘッドスパ"], "hashtags": ["ヘッドスパ"], "mods": []}, {"id": "3962782981658938644", "username": "masaki.dgc", "text": "解剖学的な根拠を持った施術と説明が必須\n\nセラピストやスパニストも\n感覚やマニュアル通りの施術では見抜かれ\n確実に信頼を失う\n\n 筋肉や皮膚構造などの原理原則に基づき\n施術の理由を論理的に説明できることがプロとして重要\n\n ブレない本物の知識が信頼を生む\n\n流行りや受け売りに頼らず\n身体の仕組みを理解することで\n時代を問わず選ばれるプロに\n\nヘッドスパ・ヘッドマッサージは\nまだまだ発展途中だから\n今このタイミングで学ぶだけで\n圧倒的に差をつけられる", "permalink": "https://www.instagram.com/reel/Db-oiBHvo0U/", "plays": 134508, "likes": null, "comments": null, "followers": 3138, "ratio": 42.9, "ageHours": 998.9, "postedAt": "2026-08-13T20:29:25+09:00", "timestampEstimated": true, "genres": ["セラピスト"], "hashtags": ["セラピスト"], "mods": ["手技"]}, {"id": "3932790337742650489", "username": "salonmaboo_j.s.a", "text": "【放送事故】カメラ回ってなくてテイク2!? 怒りのドSスタンドシャンプーww\nいつも通り色々な新兵器を使ってスタンドシャンプー！…と思いきや、まさかの2カメが撮れていない絶望的トラブルが発生😭\n\n泣く泣く撮影2回目を強いられた結果、shinomiのフラストレーションがたっぷり乗ったドSシャンプー＆悶絶マッサージに仕上がりました（笑）\n2回目の剣山ブラシはマジで頭皮なくなるかと思った…。途中のホイミスライムでの回復（？）と謎のキモカワマッサージ機にも注目です👀\n\n怒りと優しさが入り混じるカオスなASMRをぜひお楽しみください！\n\n#ASMR #スタンドシャンプー #美容師 #ヘッドスパ #shinomi #ドSシャンプー #機材トラブル #美容室 #シャンプーASMR #頭皮マッサージ", "permalink": "https://www.instagram.com/reel/DaUE_mxPTx5/", "plays": 391443, "likes": null, "comments": null, "followers": 9151, "ratio": 42.8, "ageHours": 1992.0, "postedAt": "2026-07-03T11:19:23+09:00", "timestampEstimated": true, "genres": ["ヘッドスパ"], "hashtags": ["ヘッドスパ"], "mods": []}, {"id": "Db-oiBHvo0U", "username": "masaki.dgc", "text": "", "permalink": "https://www.instagram.com/reel/Db-oiBHvo0U/", "plays": 1 うなんだろう？」と思った方はぜひレッスンへ😊\n\n📍代々木上原駅徒歩1分🚶‍♀️‍➡️\n@studiogod\n▪︎月曜日 12:30–13:30 ピラティス（FRP）\n▪︎水曜日 10:00–11:00 ピラティス（FRP）\n▪︎木曜日 13:00–14:00 ピラティス（FRP）\n▪︎金曜日 18:30–19:30（奇数週のみ）ピラティス（FRP）\n\nインストラクター養成講座も開催しています📚\n\n第7期FRPベーシックインストラクター養成講座（計12時間）\n日時：\n2026年8月2日（日）10:00-17:00\n2026年8月9日（日）10:00-17:00\n\n養成校：東京・代々木上原 @studiogod \n\n詳細・お申し込み\nhttps://shop-p3.shop-pro.jp/?pid=191640584\u0026utm_id=97760_v0_s00_e0_tv4\u0026utm_source=ig\u0026utm_medium=social\u0026utm_content=link_in_bio\n※プロフィールURLからチェックできます\n\nできるだけ毎日、\n正しい姿勢×体の不調改善をシェアします💡\n\n質問やリクエストもコメントで大歓迎です💬\n\n#ロールアップ\n#howto\n#ピラティス \n#functional_roller_pilates \n#pilates", "permalink": "https://www.instagram.com/reel/DZ7W02ISicX/", "plays": 118363, "likes": null, "comments": null, "followers": 5729, "ratio": 20.7, "ageHours": 2222.4, "postedAt": "2026-06-23T20:54:12+09:00", "timestampEstimated": true, "genres": ["ピラティス"], "hashtags": ["ピラティス"], "mods": ["スクール"]}, {"id": "DZua5FCPndz", "username": "minto.801", "text": "", "permalink": "https://www.instagram.com/reel/DZua5FCPndz/", "plays": 177000, "likes": 635, "comments": 0, "followers": 8563, "ratio": 20.7, "ageHours": 2343.0, "postedAt": "2026-06-18T20:19:36+09:00", "timestampEstimated": true, "genres": ["セラピスト"], "hashtags": ["@minto.801"], "mods": []}, {"id": "Dcz9ib1TEEi", "username": "fifty_skin_", "text": "", "permalink": "https://www.instagram.com/reel/Dcz9ib1TEEi/", "plays": 56000, "likes": 62, "comments": 0, "followers": 2705, "ratio": 20.7, "ageHours": 501.8, "postedAt": "2026-09-03T13:32:43+09:00", "timestampEstimated": true, "genres": ["更年期ケア"], "hashtags": ["@fifty_skin_"], "mods": []}, {"id": "DbZRiiGTLLu", "username": "rina_buyma_", "text": "", "permalink": "https://www.instagram.com/reel/DbZRiiGTLLu/", "plays": 24000, "likes": 15, "comments": 0, "followers": 1167, "ratio": 20.6, "ageHours": 1347.1, "postedAt": "2026-07-30T08:16:37+09:00", "timestampEstimated": true, "genres": ["オンライン秘書"], "hashtags": ["@rina_buyma_"], "mods": []}, {"id": "DbM-vy8x 、\n周囲から注目されていると思い込んでしまう心理現象」。\n\n本人が思っている以上に周りの人は他人の変化や失敗に気づいていない。\n人は誰しも「自分という物語の主人公」であるため、他人もまた『自分自身のことで頭がいっぱい』。\n\n② 私の想像（マインドリーディング）をやめる\n「根拠がないのに、『きっとこう思っているに違いない』と勝手に決めつけてしまう思考パターン」\n「私の想像（マインドリーディング）」と「事実」を切り離し、\n「証拠がない思考で自分を傷つけない」ことが大切。\n\n③ 「私はどうしたい？」で決める\n他人軸（どう見られるか）ではなく、\n自分軸（自分はどうしたいか）で動くほうが心は満たされる。\n\n④100％全員に好かれるのは無理\n全員に好かれるのは不可能だし、\n嫌われるのは「自分の意見（自由）を持って生きている証拠」。\n\n⑤ 相手の感情は相手のもの\n自分が誠実に対応したなら、どう受け取るかは相手の課題。\n他人の感情まで背負わなくてOK。\n\n⑥ 承認欲求を否定しない\n\n承認欲求は自然な欲求。\nでも、依存すると不安定になる。\n\n「欲しいけど、なくても大丈夫」にする。\n\n⑦成果がなくても自分には価値がある\n「成果が出たら価値がある」をやめる。\nあなたの価値と、結果や実績は別もの。\n\n⑧ 「べき思考」の手放し\n「〜しなければならない」「〜であるべき」を減らす。\nルールを厳しく設定するほど、他人の目や評価が怖くなる。\n「〜のほうが好ましいけれど、違っても大丈夫」に書き換えてみよう。\n\n⑨比較の対象を「過去の自分」だけに限定する\n他人の「光（成果）」と自分の「影（裏側の努力・悩み）」を比べない。\nSNSで見える他人の姿はハイライト集。\n比べるなら、昨日より1歩でも成長した「過去の自分」だけで十分。\n\n⑩「自分に問いかける習慣」をつくる\n「私はどうしたい？」「未来の自分が喜ぶのはどっち？」と問いかけ、\n思考の軸を自分に戻すトレーニングをしよう。\n\n⁡\n\n⁡\n⁡\n⁡\nーーー🌱【まいからのお知らせ】🌱ーーー\n⁡\n\n「変わりたいけれど、何から始めればいいか分からない」\nそんなあなたのために、自分を愛するためのステップをまとめた【セルフラブ・ワークブック】を公式LINEでプレゼントしています🎁\n⁡\nプロフィールのリンクから、お気軽に受け取ってくださいね🥰\n⁡\nーーーーーーーーーーーーーーーー\n⁡\n今日も一日本当にお疲れ様でした。\nがんばった自分に伝えてあげてね！\n\n#ピラティス\n#ダイエット\n#セルフラブ　\n#自己肯定感\n#マインドセット", "permalink": "https://www.instagram.com/reel/DauxC6wBaf5/", "plays": 296896, "likes": null, "comments": null, "followers": 15000, "ratio": 19.8, "ageHours": 1743.3, "postedAt": "2026-07-13T20:04:34+09:00", "timestampEstimated": true, "genres": ["ピラティス"], "hashtags": ["ピラティス"], "mods": []}, {"id": "DXq27EXkwcn", "username": "chiba_odekakeplan", "text": "", "permalink": "https://www.instagram.com/reel/DXq27EXkwcn/", "plays": 1102000, "likes": 6725, "comments": 19, "followers": 56000, "ratio": 19.7, "ageHours": 3569.3, "postedAt": "2026-04-28T18:04:47+09:00", "timestampEstimated": true, "genres": ["ヘッドスパ"], "hashtags": ["@chiba_odekakeplan"], "mods": []}, {"id": "Dca_rC7yvGe", "username": "mike_healthylife", "text": "", "permalink": "https://www.instagram.com/reel/Dca_rC7yvGe/", "plays": 255000, "likes": 398, "comments": 7, "followers": 1300 followers": 10000, "ratio": 11.4, "ageHours": 806.1, "postedAt": "2026-08-21T21:15:44+09:00", "timestampEstimated": true, "genres": ["セラピスト"], "hashtags": ["@korugi_akt"], "mods": []}, {"id": "Dbc4CNGpSqo", "username": "travel.studios", "text": "", "permalink": "https://www.instagram.com/reel/Dbc4CNGpSqo/", "plays": 77000, "likes": 1180, "comments": 2, "followers": 6815, "ratio": 11.3, "ageHours": 1313.5, "postedAt": "2026-07-31T17:50:42+09:00", "timestampEstimated": true, "genres": ["パーマネントジュエリー"], "hashtags": ["@travel.studios"], "mods": []}, {"id": "DYOMhbSzJvx", "username": "personalgym__ideal", "text": "", "permalink": "https://www.instagram.com/reel/DYOMhbSzJvx/", "plays": 5593, "likes": 6, "comments": 0, "followers": 321, "ratio": 11.2, "ageHours": 3239.9, "postedAt": "2026-05-12T11:26:57+09:00", "timestampEstimated": true, "genres": ["ピラティス"], "hashtags": ["@personalgym__ideal"], "mods": []}, {"id": "DbvBnTGBS-D", "username": "ucchi_ns3215", "text": "", "permalink": "https://www.instagram.com/reel/DbvBnTGBS-D/", "plays": 88000, "likes": 681, "comments": 11, "followers": 7827, "ratio": 11.2, "ageHours": 1144.3, "postedAt": "2026-08-07T19:00:45+09:00", "timestampEstimated": true, "genres": [], "hashtags": ["@ucchi_ns3215"], "mods": ["スクール"]}, {"id": "3895300861888687067", "username": "yurika_yorushoku", "text": "作業ロボット🤖から卒業できた秘密…🤫\n\n「今日はいい日だったな〜」って\nお客さんに帰り道でニヤニヤして欲しい💖\n\n私が15年このお仕事を続けてきて\n一番大切にしているのは、\nこの「帰り道の感情」をゴールにすることです。\n\n実はここに向かうように\nすべてのおもてなしを組み立てます✨\n\n┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈\n🌷 おもてなしのポイント 🌷\n┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈\n\n◆「もし私がお客さんだったら？」と想像する\n入室の瞬間、どんな笑顔なら安心するか、\nどんな声かけならホッとするかをフル回転！\n\n◆「お疲れさま」を心から届ける\n普段褒められることが少ない男性だからこそ、\n心からの「頑張ってますね」という想いを\n演出に込めて接します✨\n\n◆日常を忘れさせる空間づくり\n照明やBGM、自分の見た目まで。\n小さな変化でお客さんを非日常へ連れて行きます🤝\n「ただのマッサージ」を\n「最高のエンタメ」に変えていこう！\n\n━━━━━━━━━━━━━━━\n✨ 演出でギャップを作る方法 ✨\n━━━━━━━━━━━━━━━\n\n🚿 お客さんが準備されている間の「仕込み」\nここで一気に雰囲気を変えて、非日常を作ります！\n\n🕯 照明\n部屋の電気を落として、間接照明でキラキラに✨\n\n🎵 BGM\n落ち着いた大人のBARのようなジャズを流す\n\n👗 衣装\nお出迎えの服から施術着へチェンジ！\n\n👱‍♀️ 見た目\n髪もアップにまとめて印象をガラリと変える\n\n💡 なぜ「ギャップ」が大事なの？\n魅力的な人って「情報量が多い人」なんです。\nそれは知識が多いことではなく、\n「色んな面（ギャップ）」を持っているということ✨\n\n人は単調な人よりも、\n変化がある人に魅力を感じます☺️\nシーンごとに演出を変えることが、\nそのままあなたの魅力を伝えることに繋がるんです🥹✨\n\n技術だけじゃない\nあなただけの「演出」で\nお客さんを最高のゴールへエスコートしよう💖\n\n#セラピスト #接客術 #おもてなし #新人セラピスト\n\n\"music by LUNNA「アリかも？」\"", "permalink": "https://www.instagram.com/reel/DYO437mJevb/", "plays": 146076, "likes": null, "comments": null, "followers": 13000, "ratio": 11.2, "ageHours": 3233.4, "postedAt": "2026-05-12T17:54:30+09:00", "timestampEstimated": true, "genres": ["セラピスト"], "hashtags": ["セラピスト"], "mods": ["スクール"]}, {"id": "Daz3ZfMzxow", "username": "moriharuna71", "text": "", "permalink": "https://www.instagram.com/reel/Daz3ZfMzxow/", "plays": 1493000, "likes": null, "comments": null, "followers": 135000, "ratio": 11.1, "ageHours": 1695.7, "postedAt": "2026-07-15T19:36:17+09:00", "timestampEstimated": true, "genres": ["育毛"], "hashtags": ["@moriharuna71"], "mods": []}, {"id": "DccaWXkhh-t", "username": "mariko_51herb", "text": "", "permalink": "https://www.instagram.com/reel/DccaWXkhh-t/", "plays": 5540, "likes": 12, "comments": 0, "followers": 298, "ratio": 11.1, "ageHours": 721.3, "postedAt": "2026-08-25T10:02:43+09:00", "timestampEstimated": true, "genres": ["更年期ケア"], "hashtags": ["@mariko_51herb"], "mods": []}, {"id": "DZmgPdpR4Oh", "username": "houkyo.shibou", "text": "", "permalink": "https://www.instagram.com/reel/DZmgPdpR4Oh/", "plays": 80000, "likes": null, "comments": null, "followers": 7183, "ratio": 11.1, "ageHours": 2416.8, "postedAt": "2026-06-15T18:32:25+09:00", "timestampEstimated": true, "genres": ["小顔"], "hashtags": ["@houkyo.shibou"], "mods": []}, {"id": "Db0pXSIRzLj", "username": "seri_challenge", "text": "", "permalink": "https://www.instagram.com/reel/Db0pXSIRzLj/", "plays": 499000, "likes": 637, "comments": 282, "followers": 45000, "ratio": 11.1, "ageHours": 1091.9, "postedAt": "2026-08-09T23:24:17+09:00", "timestampEstimated": true, "genres": [], "hashtags": ["@seri_challenge"], "mods": のが好きだから、これがめちゃくちゃ気持ちよかった🥹✨\n\n終わった直後もスッキリした感じだったんだけど、個人的には次の日も足が軽く感じて、いつもより動きやすかったのが嬉しかった🤍\n\nしかもこれで40分2,980円なの😳\n渋谷駅からも近いし、この価格なら「今日ちょっと疲れたな〜」って日にふらっと行きやすいのもいい♡\n\nお仕事終わりとか、お買い物のついでにも良さそう🫶🏻\nまた疲れた時に行きたい☺️\n気になった方はぜひ行ってみてね💆‍♀️✨\n\nPR @yilong20131216\n#エステサロン #全身整体 #エステ", "permalink": "https://www.instagram.com/reel/Dc-INncN7KZ/", "plays": 2087, "likes": null, "comments": null, "followers": null, "ratio": null, "ageHours": 407.0, "postedAt": "2026-09-07T12:18:24+09:00", "timestampEstimated": true, "genres": ["エステティシャン"], "hashtags": ["エステサロン"], "mods": []}, {"id": "3980888244799635000", "username": "03ayaka30", "text": "最近、ちゃんと自分を休ませてる？🌿\n\n家族のこと、仕事のこと。\n毎日頑張っていると、\n自分のことってつい後回しになりがち。\n\nでも、\n頑張り続けるためには\n「休む時間」も大切だなって改めて実感♡\n\n@sr_kanagawa　\n相模大野店でほぐしてもらいましたぁ！\n\n和をモチーフにした落ち着いた空間で、\n個室もあるから周りを気にせず\nリラックスできるのが嬉しい✨\n\nゆっくり身体をほぐしてもらって、\n終わったあとは身体も気持ちもスッキリ。\n\n施術後のドリンクが\nお抹茶🍵だったよー！\n\n施術メニューが豊富で\nお得に通える方法があって\n良心的でした🥰\n\nホットペッパーから予約できるから\ncheckしてみてね😘\n⭐︎ハイライトに残しておくね！\n\n「最近ちょっと疲れてるかも」\nそんな時こそ、\n自分のための時間を作ってあげたい♡\n\n📍サンリラクゼーション相模大野店\n小田急線「相模大野駅」北口から徒歩30秒\n神奈川県相模原市南区相模大野3-14-10 足立ビル2F\n⏰ 10:00〜21:00\n☎️ 042-767-5404\n\n頑張る毎日に、\n自分を整える時間を🌿\n\n#リラクゼーションサロン #ドライヘッドスパ #肩こり改善 #リフレ #癒し", "permalink": "https://www.instagram.com/reel/Dc-9MRZz344/", "plays": 16676, "likes": null, "comments": null, "followers": null, "ratio": null, "ageHours": 399.3, "postedAt": "2026-09-07T20:01:21+09:00", "timestampEstimated": true, "genres": ["ヘッドスパ"], "hashtags": ["ドライヘッドスパ"], "mods": ["メニュー", "手技"]}, {"id": "3980242077895453902", "username": "a_min1203", "text": "癒されに行ってきた🥹🫧\n\n最近、肩も脚もパンパンで、\n久しぶりにしっかりケアしてもらいました🫶🏻\n\n今回は\n・ボディケア\n・リフレ（足裏・ふくらはぎ）\n・オイルトリートメント\n\n首・肩から脚までじっくりほぐしてもらえて、\n「もっと早く来ればよかった〜！」ってなった🥹🤍\n\nしかも施術後には抹茶まで🍵♡\n癒されすぎた〜🌼\n\n📍サンリラクゼーション町田店\nJR町田駅から徒歩3分\n@sr_kanagawa\n\n相模大野・厚木・藤沢・平塚・秦野にも店舗があるみたい🙋🏼‍♀️✨\n\n疲れが溜まってる人、ぜひチェックしてみてね🔍💞\n\n#リラクゼーションサロン #ドライヘッドスパ #肩こり改善 #リフレ #癒し", "permalink": "https://www.instagram.com/reel/Dc8qRTlBWzO/", "plays": 23767, "likes": null, "comments": null, "followers": null, "ratio": null, "ageHours": 420.7, "postedAt": "2026-09-06T22:37:32+09:00", "timestampEstimated": true, "genres": ["ヘッドスパ"], "hashtags": ["ドライヘッドスパ"], "mods": ["メニュー", "手技"]}, {"id": "3979493091194550985", "username": "raku_life_memo", "text": "🍀更年期の不調、実は皆さん同じではありません🕊️\n\n「冷える」「のぼせる」「眠れない」「めまいがする」など、 症状の出方や体質によって選ばれる漢方も変わります👩‍⚕️\n\n今回は、更年期障害にも用いられる\nツムラの漢方から9種類をまとめました。\n\n━━━━━━━━━━━━━━━\n\n24｜加味逍遙散（かみしょうようさん）\n\n冷えや気分のゆらぎが気になる方に。 肩こり・疲れやすさ・精神不安などがあり、\nときに便秘傾向がある場合にも用いられます。\n\n━━━━━━━━━━━━━━━\n\n25 ｜桂枝茯苓丸（けいしぶくりょうがん）\n\nのぼせや肩こりが気になる方に。\n比較的体力があり、顔が赤くなりやすいタイプが目安。\n更年期障害に伴う頭痛・めまい・のぼせ・肩こりなど\nにも用いられます。\n\n━━━━━━━━━━━━━━━\n\n11｜柴胡桂枝乾姜湯（さいこけいしかんきょうとう）\n\n動悸や眠りの悩みがある方に。\n体力が弱めで、\n冷え・貧血傾向・動悸・息切れ・神経過敏など\nがみられる場合に用いられる漢方です。\n\n━━━━━━━━━━━━━━━\n\n63｜五積散（ごしゃくさん）\n\n冷えや腰の不調が続く方に。\n慢性的で強すぎない症状が特徴で、 腰痛・神経痛・関節痛・月経痛・頭痛・冷え症など\nにも用いられます。\n\n━━━━━━━━━━━━━━━\n\n23｜ 当帰芍薬散（とうきしゃくやくさん）\n\nめまいや冷えが気になる方に。\n疲れやすく、腰や脚が冷えやすいタイプが目安。 更年期障害に伴う頭重・頭痛・めまい・肩こりなど\nにも用いられます。\n\n━━━━━━━━━━━━━━━\n\n113｜三黄瀉心湯（さんおうしゃしんとう）\n\nのぼせや不眠が気になる方に。\n比較的体力があり、 顔の赤み・精神不安・便秘傾向がある\nタイプに用いられる漢方です。\n\n━━━━━━━━━━━━━━━\n\n57｜温清飲（うんせいいん）\n\nのぼせや神経症状が気になる方に。\n皮膚の色つやが悪く、のぼせる方に用いられ、 月経不順・月経困難・更年期障害など\nにも効能・効果に含まれています。\n\n━━━━━━━━━━━━━━━\n\n105｜通導散（つうどうさん）\n\n腰痛や便秘が気になる方に。\n比較的体力があり、下腹部に圧痛があって\n便秘しがちなタイプが目安。 月経不順・月経痛・更年期障害などにも用いられます。\n\n━━━━━━━━━━━━━━━\n\n106｜温経湯（うんけいとう）\n\n不眠や足腰の冷えが気になる方に。\n手足はほてるのに足腰は冷える、\n唇が乾くといった特徴があり、 更年期障害・不眠・神経症などにも用いられます。\n\n━━━━━━━━━━━━━━━\n\n同じ「更年期の不調」でも、 症状だけでなく体力や冷え・のぼせなどの体質も\n漢方選びのポイントになります👩‍⚕️\nあとで見返せるように保存がおすすめです🍀\n\n#更年期障害 #緩和ケア #漢方 #ツムラ #健康と医療", "permalink": "https://www.instagram.com/reel/Dc5_-HWxbrJ/", "plays": 46666, "likes": null, "comments": null, "followers": null, "ratio": null, "ageHours": 445.5, "postedAt": "2026-09-05T21:49:25+09:00", "timestampEstimated": true, "genres": ["更年期ケア"], "hashtags": ["更年期障害"], "mods": ["手技"]}]</script>

<script>
(function () {
  var readJSON = function (id) { return JSON.parse(document.getElementById(id).textContent); };
  var POSTS = readJSON('data');
  var GENRES = readJSON('genre-list');
  var MODIFIERS = readJSON('modifier-list');
  var SUMMARY = readJSON('summary-data');
  var RISING = 66.4;   // 伸び率の上位10%にあたる値

  var activeGenres = new Set();
  var activeMods = new Set();   // 掛け合わせ語。ジャンルとはANDで効かせる
  var els = {
    sort: document.getElementById('sort'),
    period: document.getElementById('period'),
    q: document.getElementById('q'),
    genres: document.getElementById('genres'),
    modifiers: document.getElementById('modifiers'),
    list: document.getElementById('list'),
    count: document.getElementById('count'),
    summary: document.getElementById('summary'),
    breakdown: document.getElementById('breakdown')
  };

  function mk(tag, cls, text) {
    var el = document.createElement(tag);
    if (cls) el.className = cls;
    if (text !== undefined) el.textContent = text;
    return el;
  }

  // 文節を1かたまりとして置く。途中で改行されないので、
  // 「を」「と」などの助詞が行頭に来ることがなくなる。
  function phrases(parent, list) {
    list.forEach(function (t) { parent.appendChild(mk('span', 'nb', t)); });
    return parent;
  }

  // --- 集計 ---
  // タイルは必ず4枚。ジャンルはここに混ぜず、下の棒グラフで見せる。
  (function renderSummary() {
    var tiles = [
      ['表示中のリール', SUMMARY.total, '件'],
      ['直近7日のリール', SUMMARY.thisWeek, '件'],
      ['伸び率100倍超', SUMMARY.overRatio, '件'],
      ['アカウント', SUMMARY.authors, '件']
    ];
    tiles.forEach(function (t) {
      var box = mk('div', 'stat');
      box.appendChild(mk('span', 'stat-label', t[0]));
      var v = mk('div', 'stat-value', t[1].toLocaleString());
      v.appendChild(mk('span', 'unit', t[2]));
      box.appendChild(v);
      els.summary.appendChild(box);
    });
  })();

  // --- ジャンル別の内訳 ---
  // 棒の長さは最多ジャンルを100%とした相対値。1つの投稿が複数ジャンルに
  // 入ることがあり、合計が総数と一致しないため、全体に対する割合としては見せない。
  (function renderBreakdown() {
    if (!SUMMARY.genres.length) { els.breakdown.remove(); return; }

    els.breakdown.appendChild(mk('p', 'breakdown-title', 'ジャンル別'));
    var max = SUMMARY.genres.reduce(function (m, p) { return Math.max(m, p[1]); }, 0);

    // 長いジャンル名は固定幅の列に1行では収まらない。
    // 「・」の位置だけで折り、カタカナ語の途中では絶対に割らない。
    function nameParts(name) {
      var parts = name.split('・');
      return parts.map(function (t, i) {
        // 「・」は前の語にくっつける。行頭に落とさないため
        return i < parts.length - 1 ? t + '・' : t;
      });
    }

    SUMMARY.genres.forEach(function (pair) {
      var row = mk('div', 'bar-row');
      if (pair[1] === 0) row.classList.add('pending');
      row.appendChild(phrases(mk('span', 'bar-name'), nameParts(pair[0])));

      var track = mk('div', 'bar-track');
      var fill = mk('div', 'bar-fill');
      fill.style.width = (max > 0 ? (pair[1] / max) * 100 : 0) + '%';
      track.appendChild(fill);
      row.appendChild(track);

      // 数字は出さない。棒の長さで強弱は足りる。
      // まだ集まっていないものだけ、空の棒の理由が分かるよう言葉を添える
      row.appendChild(mk('span', 'bar-count', pair[1] === 0 ? '収集待ち' : ''));
      els.breakdown.appendChild(row);
    });
  })();

  // 何件のうち何件を見ているのかを明示する。
  // 「最終収集」は実際に収集した時刻。HTMLを作り直しただけでは進まない。
  (function renderStamp() {
    var stamp = document.getElementById('stamp');
    var collectedAt = SUMMARY.updatedAt || '2026-09-24 11:20';
    var units = ['最終収集 ' + collectedAt];
    if (SUMMARY.archived > SUMMARY.total) {
      units.push('　/　蓄積 ' + SUMMARY.archived.toLocaleString() + ' 件のうち ');
      units.push(SUMMARY.total.toLocaleString() + ' 件を表示');
    }
    phrases(stamp, units);
  })();

  // --- 絞り込みのチップ（2段構え） ---
  // 上段: 主ジャンル。単独で検索して意味のある語。
  // 下段: 掛け合わせ語。「経営」「メニュー」のように単独だと飲食や一般ビジネスを
  //       拾ってしまう語で、本文に該当語があるかで絞る。
  // どちらも対象を全部並べる。今日まだ回っていないものを隠すと、
  // 扱う範囲が狭まったように見えるため。
  var chipStates = [];

  function makeChip(row, label, onActivate) {
    var b = mk('span', 'chip');
    b.appendChild(mk('span', 'chip-name', label));
    if (onActivate) {
      b.tabIndex = 0;
      b.setAttribute('role', 'button');
      b.addEventListener('click', onActivate);
      b.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onActivate(); }
      });
    } else {
      // 1件も無いので押しても何も起きない。操作対象から外す
      b.classList.add('pending');
      b.setAttribute('aria-disabled', 'true');
      b.title = '該当する投稿がまだありません';
    }
    row.appendChild(b);
    return b;
  }

  function syncChips() {
    chipStates.forEach(function (s) {
      var on = s.isOn();
      s.el.classList.toggle('on', on);
      s.el.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
  }

  // 選んだ集合を切り替えるチップを1つ作る。上段と下段で作りが同じなのでまとめる
  function addToggleChip(row, name, active) {
    var chip = makeChip(row, name, function () {
      if (active.has(name)) active.delete(name);
      else active.add(name);
      syncChips();
      render();
    });
    chipStates.push({ el: chip, isOn: function () { return active.has(name); } });
  }

  function addAllChip(row, active) {
    var chip = makeChip(row, 'すべて', function () {
      active.clear();
      syncChips();
      render();
    });
    chipStates.push({ el: chip, isOn: function () { return active.size === 0; } });
  }

  addAllChip(els.genres, activeGenres);
  GENRES.forEach(function (pair) {
    if (pair[1] === 0) { makeChip(els.genres, pair[0], null); return; }
    addToggleChip(els.genres, pair[0], activeGenres);
  });

  if (MODIFIERS.length === 0) {
    els.modifiers.remove();
  } else {
    addAllChip(els.modifiers, activeMods);
    MODIFIERS.forEach(function (pair) {
      if (pair[1] === 0) { makeChip(els.modifiers, pair[0], null); return; }
      addToggleChip(els.modifiers, pair[0], activeMods);
    });
  }

  syncChips();

  function fmtAge(h) {
    if (h === null || h === undefined) return '不明';
    if (h < 24) return Math.round(h) + '時間前';
    return Math.round(h / 24) + '日前';
  }

  function filtered() {
    var days = parseInt(els.period.value, 10);
    var q = els.q.value.trim().toLowerCase();

    return POSTS.filter(function (p) {
      if (days > 0) {
        if (p.ageHours === null || p.ageHours > days * 24) return false;
      }
      if (activeGenres.size > 0) {
        var hit = p.genres.some(function (g) { return activeGenres.has(g); });
        if (!hit) return false;
      }
      // 掛け合わせはジャンルとAND。「オンライン秘書」かつ「経営」を出すため。
      // 掛け合わせ語どうしはOR（複数選ぶと候補が広がる）
      if (activeMods.size > 0) {
        var mods = p.mods || [];
        var hitMod = mods.some(function (m) { return activeMods.has(m); });
        if (!hitMod) return false;
      }
      if (q) {
        var hay = (p.text + ' ' + p.username).toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    });
  }

  function sorted(rows) {
    var mode = els.sort.value;
    var copy = rows.slice();
    // 取れていない値は必ず末尾に回す。0 として上位に混ぜない
    function desc(get) {
      return function (a, b) {
        var x = get(a), y = get(b);
        if (x === null && y === null) return 0;
        if (x === null) return 1;
        if (y === null) return -1;
        return y - x;
      };
    }
    if (mode === 'plays') copy.sort(desc(function (p) { return p.plays; }));
    else if (mode === 'newest') copy.sort(function (a, b) {
      var av = a.ageHours === null ? Infinity : a.ageHours;
      var bv = b.ageHours === null ? Infinity : b.ageHours;
      return av - bv;
    });
    else copy.sort(desc(function (p) { return p.ratio; }));
    return copy;
  }

  function render() {
    var rows = sorted(filtered());
    els.count.textContent = rows.length + ' 件を表示';
    els.list.textContent = '';

    if (rows.length === 0) {
      // 「絞り込みを」を1かたまりにして、「を」が行頭に来ないようにする
      els.list.appendChild(phrases(mk('div', 'empty'), [
        '条件に合うリールが', 'ありません。', '絞り込みを', '緩めてください。'
      ]));
      return;
    }

    var frag = document.createDocumentFragment();
    rows.forEach(function (p, i) {
      var isRising = p.ratio !== null && p.ratio >= RISING;
      var card = mk('div', 'card' + (isRising ? ' rising' : ''));

      var head = mk('div', 'card-head');
      head.appendChild(mk('span', 'rank', String(i + 1)));
      head.appendChild(mk('span', 'user', '@' + p.username));
      if (isRising) head.appendChild(mk('span', 'badge', '伸び中'));

      // 数値が取れていないときに 0 を出すと「0だった」と読めてしまう。
      // 取れなかったことが分かる形にする
      function num(v) { return v === null || v === undefined ? '—' : v.toLocaleString(); }

      var stats = mk('div', 'stats');
      stats.appendChild(mk('span', 'likes', p.ratio === null ? '伸び率 —' : '×' + p.ratio));
      stats.appendChild(mk('span', 'vel', num(p.plays) + ' 再生'));
      // 取れた時刻と、投稿番号から復元した時刻を同じ顔で見せない
      stats.appendChild(mk('span', 'age',
        fmtAge(p.ageHours) + (p.timestampEstimated ? '（およそ）' : '')));
      head.appendChild(stats);
      card.appendChild(head);

      var metrics = mk('div', 'metrics');
      [['いいね', p.likes], ['コメント', p.comments], ['フォロワー', p.followers]]
        .forEach(function (m) {
          metrics.appendChild(mk('span', 'metric', m[0] + ' ' + num(m[1])));
        });
      card.appendChild(metrics);

      card.appendChild(mk('p', 'text', p.text));

      var tags = mk('div', 'tags');
      // 上下2段のチップと同じ「ジャンル＋掛け合わせ」を出す。
      // 検索語そのものを出すと、「オンライン秘書」と「オンライン秘書 経営」が
      // 並んで冗長になり、1ジャンル1語のときは同じ語が二重に出る
      var seenTags = {};
      p.genres.concat(p.mods || []).forEach(function (t) {
        if (seenTags[t]) return;
        seenTags[t] = true;
        tags.appendChild(mk('span', 'tag', t));
      });
      // 自前で組み立てた instagram.com のURLのはず。そうでないものは
      // href を付けない（javascript: などを踏ませない）
      if (p.permalink && p.permalink.indexOf('https://www.instagram.com/') === 0) {
        var a = mk('a', 'link', 'リールを開く →');
        a.href = p.permalink;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        tags.appendChild(a);
      }
      card.appendChild(tags);
      frag.appendChild(card);
    });
    els.list.appendChild(frag);
  }

  [els.sort, els.period].forEach(function (el) {
    el.addEventListener('change', render);
  });
  els.q.addEventListener('input', render);

  render();
})();
</script>
