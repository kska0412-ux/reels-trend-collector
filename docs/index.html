<title>Instagram Reel Research Tool（美容ビジネス ver）</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@600;900&family=Roboto+Mono:wght@400;500;700&display=swap">
<style>
  /* 明るい側を基準に全トークンを定義する。暗い側は下で上書きする。 */
  :root {
    --bg: #f6f4f5;
    --surface: #ffffff;
    --surface-2: #fbf9fa;
    --ink: #231c22;
    --muted: #6f636c;
    --border: #e4dee2;
    --accent: #8b2f5f;
    --accent-soft: #f7e9f0;
    --rising: #0f7b6c;
    --rising-soft: #e2f2ef;
    --chip: #efeaed;
    --focus: #8b2f5f;
  }
  /* OS が暗いとき。ただし閲覧者が明るいテーマを選んでいたらそちらを優先する。 */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #151114;
      --surface: #1f1a1e;
      --surface-2: #241e23;
      --ink: #f0eaee;
      --muted: #a3969e;
      --border: #332b31;
      --accent: #e086b0;
      --accent-soft: #3a2130;
      --rising: #4fc3ae;
      --rising-soft: #16332e;
      --chip: #2c2429;
      --focus: #e086b0;
    }
  }
  /* 閲覧者が暗いテーマを選んだとき。OS の設定に関係なく効かせる。 */
  :root[data-theme="dark"] {
    --bg: #151114;
    --surface: #1f1a1e;
    --surface-2: #241e23;
    --ink: #f0eaee;
    --muted: #a3969e;
    --border: #332b31;
    --accent: #e086b0;
    --accent-soft: #3a2130;
    --rising: #4fc3ae;
    --rising-soft: #16332e;
    --chip: #2c2429;
    --focus: #e086b0;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    /* 透明のままだと閲覧側の地の色を借りてしまうので必ず塗る */
    background: var(--bg);
    color: var(--ink);
    /* 日本語本文はWebフォントを落とすと重いので、端末のフォントを使う */
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP",
                 -apple-system, BlinkMacSystemFont, "Yu Gothic Medium", sans-serif;
    line-height: 1.75;
    font-feature-settings: "palt" 1;
    word-break: normal;
    overflow-wrap: break-word;
    line-break: strict;
  }

  .wrap { max-width: 880px; margin: 0 auto; padding: 40px 20px 96px; }

  :focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
    border-radius: 4px;
  }

  /* --- 見出し --- */
  h1 {
    font-family: "Zen Old Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
    font-weight: 900;
    font-size: clamp(1.5rem, 4vw, 2.1rem);
    line-height: 1.35;
    letter-spacing: .01em;
    margin: 0;
    text-wrap: balance;
  }
  /* 対象ジャンルの但し書き。名前より一段弱く見せる */
  .ver {
    display: block;
    font-family: "Hiragino Sans", "Noto Sans JP", sans-serif;
    font-weight: 400;
    font-size: .74rem;
    letter-spacing: .02em;
    color: var(--muted);
    margin-top: 6px;
  }

  /* --- 集計：詳細より先に全体像を出す --- */
  .panel {
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    background: var(--surface);
    margin: 28px 0 8px;
  }
  /* 4枚で固定する。auto-fit だと枚数によって最後の1枚だけ次の行に
     取り残され、空いた枠が塗り残しに見えてしまうため。 */
  .summary {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1px;
    background: var(--border);
  }
  @media (max-width: 620px) {
    /* 4枚なので2列でもきれいに埋まる */
    .summary { grid-template-columns: repeat(2, 1fr); }
  }
  .stat { background: var(--surface); padding: 14px 16px; }

  /* --- ジャンル別の内訳 --- */
  /* 棒にしておけば、ジャンルが何個あっても1行1本で並ぶので取り残しが出ない */
  .breakdown { padding: 15px 16px 17px; border-top: 1px solid var(--border); }
  .breakdown-title {
    font-size: .7rem; color: var(--muted); letter-spacing: .06em;
    margin: 0 0 11px; white-space: nowrap;
  }
  /* 名前の列は固定幅。名前に合わせて伸ばすと、長いジャンルの行だけ棒の
     開始位置がずれて、棒どうしの長さを目で比べられなくなる。
     収まらない名前は「・」の位置で折る（折り位置は .nb で決め打ち）。
     幅と高さは実際のジャンル名から build_html.py が計算して埋める。 */
  .bar-row {
    display: grid;
    grid-template-columns: 11.5em 1fr auto;
    gap: 12px; align-items: center;
  }
  .bar-row + .bar-row { margin-top: 8px; }
  /* 1行で収まる名前も2行の名前と同じ高さにする。混ざると行の間隔が
     ばらついて、棒の並びが読みにくくなる。
     flex にしているのは、折り返した2行をまとめて上下中央に置くため。 */
  .bar-name {
    font-size: .76rem; line-height: 1.4;
    min-height: 1.4em;
    display: flex; flex-wrap: wrap; align-content: center;
  }
  .bar-track {
    height: 6px; border-radius: 999px;
    background: var(--chip); overflow: hidden;
  }
  .bar-fill { height: 100%; border-radius: 999px; background: var(--accent); }
  .bar-count {
    font-family: "Roboto Mono", ui-monospace, monospace;
    font-size: .74rem; color: var(--muted);
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  @media (max-width: 620px) {
    /* 幅は変えない。変えると狭い画面だけ折り返し位置が変わってしまう */
    .bar-row { gap: 9px; }
  }
  /* まだ集まっていないジャンル。対象には入っているので消さず、弱く見せる */
  .bar-row.pending .bar-name { color: var(--muted); }
  .bar-row.pending .bar-track { opacity: .55; }
  /* 「収集待ち」は日本語なので、等幅フォントに任せず本文と同じ書体で出す */
  .bar-row.pending .bar-count {
    font-family: "Hiragino Sans", "Noto Sans JP", sans-serif;
    font-size: .7rem;
  }
  .stat-label {
    font-size: .7rem; color: var(--muted); letter-spacing: .06em;
    display: block; margin-bottom: 4px;
    /* 「表示中/の投稿」のように助詞で割れないよう、まとめて扱う */
    white-space: nowrap;
  }
  .stat-value {
    white-space: nowrap;
    font-family: "Roboto Mono", ui-monospace, monospace;
    font-size: 1.25rem; font-weight: 700;
    font-variant-numeric: tabular-nums;
    line-height: 1.2;
  }
  .stat-value .unit { font-size: .72rem; font-weight: 400; color: var(--muted); margin-left: 3px; }
  .stamp {
    font-family: "Roboto Mono", ui-monospace, monospace;
    font-size: .7rem; color: var(--muted); margin: 0 0 26px;
  }

  /* --- 操作バー --- */
  .controls {
    position: sticky; top: 0; z-index: 10;
    background: var(--bg);
    padding: 12px 0 14px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 18px;
  }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .row + .row { margin-top: 8px; }
  select, input[type=search] {
    font: inherit; font-size: .82rem;
    padding: 7px 11px;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: var(--surface);
    color: var(--ink);
  }
  input[type=search] { flex: 1; min-width: 180px; }
  .chip {
    display: inline-flex; align-items: baseline; gap: 6px;
    font-size: .78rem; padding: 5px 13px;
    border: 1px solid var(--border); border-radius: 999px;
    background: var(--surface); color: var(--muted);
    cursor: pointer; user-select: none;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  .chip.on {
    background: var(--accent-soft); border-color: var(--accent);
    color: var(--accent); font-weight: 700;
  }
  /* どちらの行を押しているのか分かるようにする。2段になると迷いやすい */
  .filter-label {
    font-size: .7rem; color: var(--muted); letter-spacing: .04em;
    white-space: nowrap; min-width: 5.5em;
  }
  /* ジャンル名は途中で割らない。「ダイエット」を「ダイ」と「エット」に分けない */
  .chip-name { white-space: nowrap; }
  /* まだ1件も無いジャンル。押しても空振りするので、選べないことを見た目で示す */
  .chip.pending {
    opacity: .45; cursor: default;
    border-style: dashed;
  }
  .chip.pending:hover { border-color: var(--border); color: var(--muted); }
  .count {
    white-space: nowrap;
    font-family: "Roboto Mono", ui-monospace, monospace;
    color: var(--muted); font-size: .76rem; margin-bottom: 14px;
    font-variant-numeric: tabular-nums;
  }

  /* --- カード --- */
  #list { display: flex; flex-direction: column; gap: 10px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid transparent;
    border-radius: 10px;
    padding: 16px 18px;
  }
  /* 伸びが速い投稿は左端の色で一目で分かるようにする */
  .card.rising { border-left-color: var(--rising); background: var(--surface-2); }

  .card-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 9px; }
  .rank {
    font-family: "Roboto Mono", ui-monospace, monospace;
    font-size: .74rem; color: var(--muted);
    font-variant-numeric: tabular-nums; min-width: 2.4em;
  }
  .user { font-weight: 700; font-size: .86rem; }
  .badge {
    white-space: nowrap;
    font-size: .66rem; font-weight: 700; letter-spacing: .04em;
    padding: 2px 8px; border-radius: 999px;
    background: var(--rising-soft); color: var(--rising);
  }
  .stats {
    margin-left: auto; display: flex; gap: 11px;
    font-family: "Roboto Mono", ui-monospace, monospace;
    font-size: .74rem; font-variant-numeric: tabular-nums;
  }
  /* 数字と単位を離さない。「120,000」と「再生」が割れると読めなくなる */
  .likes { color: var(--accent); font-weight: 700; white-space: nowrap; }
  /* 再生・いいね・コメント・フォロワー。数字と単位を離さない */
  .metrics {
    display: flex; flex-wrap: wrap; gap: 12px;
    font-size: .74rem; color: var(--muted); margin: 0 0 8px;
    font-variant-numeric: tabular-nums;
  }
  .metric { white-space: nowrap; }
  .vel { color: var(--rising); font-weight: 500; white-space: nowrap; }
  .age { color: var(--muted); white-space: nowrap; }

  .text {
    white-space: pre-wrap;
    /* word-break: break-word は単語の途中で割るので使わない。
       overflow-wrap なら、1語が行に収まらないときだけ割る。
       line-break: strict で日本語の禁則処理を厳しい方に寄せる。 */
    word-break: normal;
    overflow-wrap: break-word;
    line-break: strict;
    font-size: .92rem; margin: 0 0 12px;
  }

  /* 文節のかたまり。ここで囲った範囲は途中で改行されない。
     「を」「と」などの助詞が行頭に来るのを防ぐために使う。 */
  .nb { white-space: nowrap; }

  .tags { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .tag {
    white-space: nowrap;
    font-size: .7rem; padding: 3px 9px; border-radius: 4px;
    background: var(--chip); color: var(--muted);
  }
  .link {
    margin-left: auto; font-size: .76rem; color: var(--accent);
    text-decoration: none; font-weight: 700; white-space: nowrap;
  }
  .link:hover { text-decoration: underline; }

  .empty { text-align: center; color: var(--muted); padding: 64px 20px; font-size: .88rem; }
</style>

性更年期 #女性更年期 #更年期障害 #健康習慣 40代女性 50代女性 40代男性 50代男性 アンチエイジング 健康第一 ホルモンバランス 美習慣ママ 健康豆知識 不調改善", "permalink": "https://www.instagram.com/reel/DZZ1IkTJHyM/", "plays": 2289171, "likes": null, "comments": null, "followers": 12000, "ratio": 190.8, "ageHours": 2567.1, "postedAt": "2026-06-10T20:24:51+09:00", "timestampEstimated": true, "genres": ["更年期ケア"], "hashtags": ["更年期", "更年期障害"], "mods": []}, {"id": "DZZ1IkTJHyM", "username": "bishukan_mama", "text": "", "permalink": "https://www.instagram.com/reel/DZZ1IkTJHyM/", "plays": 2289000, "likes": 1120, "comments": 9, "followers": 12000, "ratio": 190.8, "ageHours": 2567.1, "postedAt": "2026-06-10T20:24:51+09:00", "timestampEstimated": true, "genres": ["更年期ケア"], "hashtags": ["@bishukan_mama"], "mods": []}, {"id": "3914873308248427285", "username": "yurutto_kenkou_life", "text": "その謎の不調、実は閉経が近いサインかも…🥺\n\n​閉経の前後10年間は、心と体が次のステージへ\n向けて大きくシフトチェンジする大切な時期。\n見落としがちなリアルな変化をチェックしてみてね！\n\n​🚨 見落としがちな初期サイン12選\n​1. 異常に氷が食べたくなる\n女性ホルモン（エストロゲン）が減って生理が乱れると、隠れ貧血になりやすいの。脳への血流が減って体温調節が狂うと、なぜか口を冷やしたくなって氷をガリガリ欲しくなるんだって！🧊\n\n​2. 朝起きたときに手の指が強張る・痛む\nエストロゲンには関節の炎症を抑える役目があるの。これが急に減ることで関節がスムーズに動かなくなって、特に朝方に指が曲がりにくくなったり痛んだりするよ💦\n\n​3. ドライアイや口の渇きがひどい\n実は目や口、肌に潤いを与えているのもエストロゲン。分泌が減ると全身の粘膜の水分キープ力が一気に落ちるから、目がゴロゴロしたり口が渇きやすくなったりするの😢\n\n​4. 髪がパサつく・抜け毛が増える\n髪のツヤやハリ、成長を支えてくれているのも女性ホルモン。これが減ると髪が細くなったり、頭頂部を中心に全体的な抜け毛が増えたりする原因になるよ。\n\n​5. なぜか皮膚がかゆい\nホルモンが減るとお肌のバリア機能が低下。乾燥のせいで、衣類の擦れとか普段ならなんてことない刺激にもお肌が過敏になって、背中や頭皮が痒くなることがあるの。\n\n​6. 理由もないのに強い不安感に襲われる\nエストロゲンは心の安定を保つ「セロトニン」を作ってくれているの。ホルモンが激減するとセロトニンも減るから、理由がないのに急に不安や焦りが爆発することもあるよ💦\n\n​7. 匂いに敏感・自分の体臭が気になる\n自律神経の乱れから嗅覚が過敏になって、匂いに敏感になる人が多いの。あとはホットフラッシュのベタついた汗のせいで、実際に体臭が変わりやすい時期でもあるよ。\n\n​8. トイレの回数が増える（頻尿・尿もれ）\n尿道や骨盤の筋肉をしなやかに保つ力が弱まるから、筋肉が萎縮して硬くなるの。急に強い尿意を感じたり、くしゃみをした拍子にヒヤッとしたりしやすくなるよ。\n\n​9. ぐっすり寝たはずなのに昼間に猛烈な眠気\n夜中に自覚のないほてりや発汗が起きて、睡眠の質が下がっているケースがすごく多いの。脳が休めていないから、日中に耐えがたい眠気がきちゃうんだ🥱\n\n​10. かかとのガサガサが治らない\nお肌の乾燥＆生まれ変わりのサイクルが遅くなるのが原因。特に皮脂腺のないかかとは角質がどんどん硬くなって、クリームを塗ってもひび割れが治りにくくなるよ。\n\n​11. 悲しくないのに涙もろくなる\n脳の視床下部は、ホルモンの司令塔であり感情のコントロールセンター。卵巣の機能が落ちて脳がパニックを起こすから、感情のブレーキが利かなくて涙が出やすくなるの。\n\n​12. 生理の周期が短くなる\n閉経に近づくと、脳が「ホルモン出して！」って焦って卵胞を急いで育ててしまうの。だから周期が遅れるより先に「21〜25日周期」に早まる人が実は多いんだよ💡\n\n​\n​大人の第2章、もっと身軽に楽しもう！✨\n​これらの症状は、体が次の新しいステージへ\n行くために一生懸命がんばっている証拠。\n\n自分を責めずに「私の体、お疲れ様」って\n労ってあげようね🌱\n\n​これからの変化に落ち着いて備えるために、\nまずは【保存】していつでも見返せるように\nしておいてね！\n\n✤··········✤··········✤··········✤··········✤··········✤········✤\nこんにちは😊\n\nこのアカウントでは\n【今日から変われる健康情報】\nを日々お届けしています。\n\nあなたの暮らしに役立つ情報が\n見つかりますように✨\n\n@yurutto_kenkou_life←他の投稿はこちらから\n\nいいね❤️コメント💬フォロー🤗\nとーっても励みになります!\n✤··········✤··········✤··········✤··········✤··········✤········✤\n​#閉経前サイン #更年期 #40代の悩み #プレ更年期 #女性の健康", "permalink": "https://www.instagram.com/reel/DZUbIguzksV/", "plays": 2432785, "likes": null, "comments": null, "followers": 13000, "ratio": 187.1, "ageHours": 2617.5, "postedAt": "2026-06-08T18:01:27+09:00", "timestampEstimated": true, "genres": ["更年期ケア"], "hashtags": ["更年期"], "mods": []}, {"id": "DcnrCoNPII0", "username": "naru.tensyoku", "text": "", "permalink": "https://www.instagram.com/reel/DcnrCoNPII0/", "plays": 525000, "likes": 435, "comments": 1, "followers": 2874, "ratio": 182.7, "ageHours": 648.6, "postedAt": "2026-08-29T19:00:13+09:00", "timestampEstimated": true, "genres": [], "hashtags": ["@naru.tensyoku"], "mods": ["スクール"]}, {"id": "3961284419280600982", "username": "yuipilates", "text": "「インストラクターの先生でも震えるんですか？」\nとよく聞かれますが、、\n\n震えます！😂\n\n実はこの“震え”、\n単純に筋力がないから起こるとは限りません。\n\n身体を動かすとき、脳・神経系は\n「どの筋肉を」\n「どのタイミングで」\n「どのくらい働かせるか」\nを細かく調整しています。\n\nこれが“モーターコントロール（運動制御）”。\n\n慣れていない動きや細かなコントロールが必要な動きでは、\n筋出力を一定に保つことが難しくなり、\nプルプルと震えが出ることもあります。\n\nもちろん、負荷が高いときや筋疲労によって震えることも。\n\nだから、\n「震える＝筋力不足」\n「震える＝できていない」\nとは限りません。\n\n大切なのは“震えないこと”ではなく、\nその中でも身体のポジションや動きを\n適切にコントロールできているか。\n\nピラティスは筋肉を鍛えるだけでなく、\n“身体をどう動かすか”を学習していく運動です。\n\n#ピラティス #ピラティスインストラクター #ピラティストレーナー #現実ピラティス #pilates", "permalink": "https://www.instagram.com/reel/Db5TzEJgn-W/", "plays": 457799, "likes": null, "comments": null, "followers": 2574, "ratio": 177.9, "ageHours": 1080.7 estampEstimated": true, "genres": ["パーマネントジュエリー"], "hashtags": ["@travel.studios"], "mods": []}, {"id": "DXlPMSQEVvI", "username": "_claire_permanent.jewelry", "text": "", "permalink": "https://www.instagram.com/reel/DXlPMSQEVvI/", "plays": 36000, "likes": 31, "comments": 0, "followers": 99, "ratio": 72.0, "ageHours": 3653.9, "postedAt": "2026-04-26T13:41:24+09:00", "timestampEstimated": true, "genres": ["パーマネントジュエリー"], "hashtags": ["@_claire_permanent.jewelry"], "mods": []}, {"id": "3948277984129193129", "username": "jun_tsubocare_lab", "text": "「病気というほどではないけれど、なんだか調子が悪い…」 \n\nそれ、40代から急増する「更年期の隠れSOS」\nかもしれません。\n\nご紹介した10個のサインについて、\nそれぞれの理由と今日からできる簡単なケア方法を\nまとめました🌿\n\n1．喉につっかえ感・違和感がある ➡ ストレスなどで気持ちが張りつめ、のど周りに違和感が出やすい状態かも。\n 💡【対処法】深呼吸をして、ジャスミン茶やシソなど香りの良いお茶で気分をゆるめましょう。\n\n2．朝、手や指の関節がこわばる ➡ 巡りが落ちて、体のすみずみまで栄養が届きにくくなっているサイン。\n 💡【対処法】朝起きたら白湯を飲み、手首や指先をやさしくグーパー運動。\n\n3．急に高所や運転が怖くなる ➡ 心と体のエネルギーが減り、不安を感じやすくなっているかも。\n 💡【対処法】無理をせず「今は省エネモード」と考え、早めの就寝を意識しましょう。\n\n4．足の裏がジリジリ熱い・ほてる ➡ 体のうるおいが不足し、熱がこもりやすくなっている状態かも。 \n💡【対処法】夜の足もみや、クコの実・黒ごま・黒豆などを取り入れて、体のうるおいを補いましょう。\n\n5．まぶたがピクピク痙攣する ➡ 疲れや睡眠不足が続き、体が休息を求めているサイン。 \n💡【対処法】寝る前はスマホを控え、温かい蒸しタオルで目元をゆっくり温めましょう。\n\n6．爪が割れやすい・縦すじが入る ➡ 栄養や血流が不足し、爪にまで影響が出始めているかも。 \n💡【対処法】胃腸にやさしい食事を心がけ、爪の保湿も忘れずに。\n\n7．抜け毛や白髪が急に増えた ➡ 年齢だけでなく、若々しさを支える力が低下しているサインかも。 \n💡【対処法】頭皮をやさしくマッサージし、黒豆やひじきなど黒い食材も意識してみましょう。\n\n8．かかとがガサガサに乾燥・ひび割れる ➡ 冷えとうるおい不足が進んでいるサイン。 \n💡【対処法】足首やお腹を温め、お風呂上がりはしっかり保湿しましょう。\n\n9．舌のふちに歯型がついている ➡ 胃腸が疲れ、余分な水分をため込みやすくなっている状態。 \n💡【対処法】冷たい飲み物を控え、温かいスープや温野菜で胃腸をいたわりましょう。\n\n10．夕方になると顔だけカッカと熱い ➡ 疲れがたまり、体に熱がこもりやすくなっているサイン。 \n💡【対処法】深呼吸をしながらゆっくり過ごし、夕方以降は無理をせずリラックスする時間をつくりましょう。\n\n✨ 「年齢のせいだから…」と我慢しないで\n\n40代からの不調は、体が一生懸命送ってくれているSOSサインかもしれません。\n\nまずは「最近こんなことあったな」と、\n自分の体の声に気づいてあげることがセルフケアの第一歩🌿\n\n当てはまる項目があった方は、ぜひコメントで番号を教えてください😊\n\nあとで見返せるように【保存】もお忘れなく🔖\n\n----------\n2児のアラフォーママ×鍼灸師🌿\n♢忙しくても体は整えられる\n♢東洋医学×ツボケアで回復しやすい身体づくり\n｢今も未来も、心地よく美しく生きたい｣女性へ✨\n----------\n\n#セルフケア #東洋医学 #インナービューティー #更年期 #養生", "permalink": "https://www.instagram.com/reel/DbLGehehBSp/", "plays": んぱく質をしっかり摂ること、ウォーキングや軽い筋トレなどで筋肉を維持することが、これからの健康につながります。\n\n🌻大切なのは、「我慢すること」ではなく、「今の自分の体を知ること」。\n\n自分のステージを知るだけでも、食事や生活習慣を見直すきっかけになります😊\n\n💬 あなたは今どのステージでしたか？\nぜひコメントで教えてください♪\n\n📌 保存して、あとで見返してください😊\n\n🌻 他にも「無理しない食習慣」で、更年期を少しラクにする食事や健康習慣を発信しています。\n\n👉 @murishinai_gohan_life\nプロフィールから他の投稿もぜひ見てください🌻\n\n#更年期 #更年期ケア #40代女性 #50代女性 #無理しない食習慣", "permalink": "https://www.instagram.com/reel/Dabc3f-z2fF/", "plays": 368040, "likes": null, "comments": null, "followers": 5853, "ratio": 62.9, "ageHours": 1955.5, "postedAt": "2026-07-06T08:02:41+09:00", "timestampEstimated": true, "genres": ["更年期ケア"], "hashtags": ["更年期"], "mods": []}, {"id": "DYZasmhTLnz", "username": "naya_nagareyama", "text": "", "permalink": "https://www.instagram.com/reel/DYZasmhTLnz/", "plays": 623000, "likes": 7908, "comments": 185, "followers": 10000, "ratio": 62.3, "ageHours": 3167.5, "postedAt": "2026-05-16T20:02:27+09:00", "timestampEstimated": true, "genres": ["ヘッドスパ"], "hashtags": ["@naya_nagareyama"], "mods": []}, {"id": "DaNHWSzxEnH", "username": "doi_hari_salon", "text": "", "permalink": "https://www.instagram.com/reel/DaNHWSzxEnH/", "plays": 580000, "likes": 2218, "comments": 7, "followers": 9332, "ratio": 62.2, "ageHours": 2089.1, "postedAt": "2026-06-30T18:25:17+09:00", "timestampEstimated": true, "genres": ["小顔"], "hashtags": ["@doi_hari_salon"], "mods": []}, {"id": "DZl5kFPpFl3", "username": "bishukan_mama", "text": "", "permalink": "https://www.instagram.com/reel/DZl5kFPpFl3/", "plays": 731000, "likes": 467, "comments": 1, "followers": 12000, "ratio": 60.9, "ageHours": 2454.6, "postedAt": "2026-06-15T12:54:27+09:00", "timestampEstimated": true, "genres": ["更年期ケア"], "hashtags": ["@bishukan_mama"], "mods": []}, {"id": "Dcs-mBpSAhl", "username": "mike_healthylife", "text": "", "permalink": "https://www.instagram.com/reel/Dcs-mBpSAhl/", "plays": 849000, "likes": 417, "comments": 8, "followers": 14000, "ratio": 60.6, "ageHours": 599.1, "postedAt": "2026-08-31T20:27:16+09:00", "timestampEstimated": tru n安心をくれる先生の存在に、今日も心から感謝。\n\n​皆さんは最近、自分の体を「信じて」あげられていますか？💬\n\nキャンセル待ちですが、もしご希望の方がありましたらコメントで教えてくださいね✨️", "permalink": "https://www.instagram.com/reel/DbdZMbpTePc/", "plays": 37477, "likes": null, "comments": null, "followers": 1379, "ratio": 27.2, "ageHours": 1340.9, "postedAt": "2026-07-31T22:40:28+09:00", "timestampEstimated": true, "genres": ["セラピスト"], "hashtags": ["セラピスト"], "mods": ["スクール"]}, {"id": "3910595382517329063", "username": "nailsalon_dreams__", "text": "1日Vlog〜💞💞\n#大阪ネイルサロン  #ギャルネイル  #ネイル  #ネイルデザイン #堺ネイルサロン", "permalink": "https://www.instagram.com/reel/DZFOcf7Omyn/", "plays": 108846, "likes": null, "comments": null, "followers": 3995, "ratio": 27.2, "ageHours": null, "postedAt": "", "timestampEstimated": false, "genres": [], "hashtags": ["ネイルデザイン"], "mods": []}, {"id": "3939220126041940873", "username": "murishinai_gohan_life", "text": "「最近なんだか調子が悪い…」\nそれは更年期症状かもしれません。\n\nでも、もしその不調で\n✅仕事に行けない\n✅家事ができない\n✅外出するのもつらい\n\nなど日常生活に支障が出ているなら「更年期障害」の可能性もあります。\n\n更年期症状と更年期障害は同じように思われがちですが、大きな違いは「生活への影響の大きさ」です。\n\nつらいときは「もう少し我慢しよう」と一人で抱え込まず、婦人科などの医療機関に相談することも大切な選択肢😊\n\n食事や運動などのセルフケアも大切ですが、必要なときは医療の力を借りることも、自分を大切にすることにつながります🌻\n\n📌保存して、つらいときの目安にしてください。\n\n💬「更年期症状」と「更年期障害」の違い、知っていましたか？\n\n#更年期 #更年期障害 #40代50代 #健康習慣 #更年期ケア", "permalink": "https://www.instagram.com/reel/Daq69VwzKOJ/", "plays": 157998, "likes": null, "comments": null, "followers": 5853, "ratio": 27.0, "ageHours": 1811.3, "postedAt": "2026-07-12T08:14:14+09:00", "timestampEstimated": true, "genres": ["更年期ケア"], "hashtags": ["更年期障害"], "mods": []}, {"id": "DdD_y6vhYkM", "username": "raco6y_", "text": "", "permalink": "https://www.instagram.com/reel/DdD_y6vhYkM/", "plays": 860000, "likes": 8410, "comments": 212, "followers": 32000, "ratio": 26.9, "ageHours": 384.5, "postedAt": "2026-09-09T19:00:18+09:00", "timestampEstimated": true, "genres": ["更年期ケア"], "hashtags": ["@raco6y_"], "mods": []}, {"id": "DXLvJJyza-x", "username": "yumichan_oilcare", "text": "", "permalink": "https://www.instagram.com/reel/DXLvJJy がもっと面白くなりますよ😙\n\nなんとなく続く不調や体の使いにくさは、姿勢の崩れから始まっていることも多いです。\nピラティスはただエクササイズをするだけではなく正しい姿勢や正しい体の使い方を学んでいくもの。\nその考え方を大切にしているのがファンクショナルローラーピラティスです！\n\n姿勢が変わると、体の使い方が変わる。体の使い方が変わると、不調が変わる。\n\n「自分の姿勢どうなんだろう？」と思った方はぜひレッスンへ😊\n\n📍代々木上原駅徒歩1分🚶‍♀️‍➡️\n@studiogod\n▪︎月曜日 12:30–13:30 ピラティス（FRP）\n▪︎水曜日 10:00–11:00 ピラティス（FRP）\n▪︎木曜日 13:00–14:00 ピラティス（FRP）\n▪︎金曜日 18:30–19:30（奇数週のみ）ピラティス（FRP）\n\nインストラクター養成講座も開催しています📚\n\n第7期FRPベーシックインストラクター養成講座（計12時間）\n日時：\n2026年8月2日（日）10:00-17:00\n2026年8月9日（日）10:00-17:00\n\n養成校：東京・代々木上原 @studiogod \n\n詳細・お申し込み\nhttps://shop-p3.shop-pro.jp/?pid=191640584\u0026utm_id=97760_v0_s00_e0_tv4\u0026utm_source=ig\u0026utm_medium=social\u0026utm_content=link_in_bio\n※プロフィールURLからチェックできます\n\nできるだけ毎日、\n正しい姿勢×体の不調改善をシェアします💡\n\n質問やリクエストもコメントで大歓迎です💬\n\n#ロールアップ\n#howto\n#ピラティス \n#functional_roller_pilates \n#pilates", "permalink": "https://www.instagram.com/reel/DZ7W02ISicX/", "plays": 118363, "likes": null, "comments": null, "followers": 5729, "ratio": 20.7, "ageHours": 2254.7, "postedAt": "2026-06-23T20:54:12+09:00", "timestampEstimated": true, "genres": ["ピラティス"], "hashtags": ["ピラティス"], "mods": ["スクール"]}, {"id": "Dcz9ib1TEEi", "username": "fifty_skin_", "text": "", "permalink": "https://www.instagram.com/reel/Dcz9ib1TEEi/", "plays": 56000, "likes": 62, "comments": 0, "followers": 2705, "ratio": 20.7, "ageHours": 534.0, "postedAt": "2026-09-03T13:32:43+09:00", "timestampEstimated": true, "genres": ["更年期ケア"], "hashtags": ["@fifty_skin_"], "mods": []}, {"id": "DcKADo2yJeX", "username": "jimuno_yobiko", "text": "", "permalink": "https://www.instagram.com/reel/DcKADo2yJeX/", "plays": 201000, "likes": 180, "comments": 3, "followers": 9709, "ratio": 20.7, "ageHours": 925.1, "postedAt": "2026-08-18T06:26:38+09:00", "timestampEstimated": true, "genres": ["ピラティス"], "hashtags": ["@jimuno_yobiko"], "mods": []}, {"id": "DbZRiiGTLLu", "username": "rina_buyma_", "text": "", "permalink": "https://www.instagram.com/reel/DbZRiiGTLLu/", "plays": 24000, "likes": 15, "comments": 0, "foll 持って生きている証拠」。\n\n⑤ 相手の感情は相手のもの\n自分が誠実に対応したなら、どう受け取るかは相手の課題。\n他人の感情まで背負わなくてOK。\n\n⑥ 承認欲求を否定しない\n\n承認欲求は自然な欲求。\nでも、依存すると不安定になる。\n\n「欲しいけど、なくても大丈夫」にする。\n\n⑦成果がなくても自分には価値がある\n「成果が出たら価値がある」をやめる。\nあなたの価値と、結果や実績は別もの。\n\n⑧ 「べき思考」の手放し\n「〜しなければならない」「〜であるべき」を減らす。\nルールを厳しく設定するほど、他人の目や評価が怖くなる。\n「〜のほうが好ましいけれど、違っても大丈夫」に書き換えてみよう。\n\n⑨比較の対象を「過去の自分」だけに限定する\n他人の「光（成果）」と自分の「影（裏側の努力・悩み）」を比べない。\nSNSで見える他人の姿はハイライト集。\n比べるなら、昨日より1歩でも成長した「過去の自分」だけで十分。\n\n⑩「自分に問いかける習慣」をつくる\n「私はどうしたい？」「未来の自分が喜ぶのはどっち？」と問いかけ、\n思考の軸を自分に戻すトレーニングをしよう。\n\n⁡\n\n⁡\n⁡\n⁡\nーーー🌱【まいからのお知らせ】🌱ーーー\n⁡\n\n「変わりたいけれど、何から始めればいいか分からない」\nそんなあなたのために、自分を愛するためのステップをまとめた【セルフラブ・ワークブック】を公式LINEでプレゼントしています🎁\n⁡\nプロフィールのリンクから、お気軽に受け取ってくださいね🥰\n⁡\nーーーーーーーーーーーーーーーー\n⁡\n今日も一日本当にお疲れ様でした。\nがんばった自分に伝えてあげてね！\n\n#ピラティス\n#ダイエット\n#セルフラブ　\n#自己肯定感\n#マインドセット", "permalink": "https://www.instagram.com/reel/DauxC6wBaf5/", "plays": 296896, "likes": null, "comments": null, "followers": 15000, "ratio": 19.8, "ageHours": 1775.5, "postedAt": "2026-07-13T20:04:34+09:00", "timestampEstimated": true, "genres": ["ピラティス"], "hashtags": ["ピラティス"], "mods": []}, {"id": "DdI_pATpss_", "username": "rie_kassa", "text": "", "permalink": "https://www.instagram.com/reel/DdI_pATpss_/", "plays": 140000, "likes": 412, "comments": 27, "followers": 7096, "ratio": 19.7, "ageHours": 338.0, "postedAt": "2026-09-11T17:35:09+09:00", "timestampEstimated": true, "genres": ["セラピスト"], "hashtags": ["@rie_kassa"], "mods": []}, {"id": "DXq27EXkwcn", "username": "chiba_odekakeplan", "text": "", "permalink": "https://www.instagram.com/reel/DXq27EXkwcn/", "plays": 1102000, "likes": 6725, "comments": 19, "followers": 56000, "ratio": 19.7, "ageHours": 3601.5, "postedAt": "2026-04-28T18:04:47+09:00", "timestampEstimated": true, "genres": ["ヘッドスパ"], "hashtags": ["@chiba_odekakeplan"], "mods": []}, {"id": "DauxC6wBaf5", "username": "mai_no_diet", "text": "", "permalink": "https://www.instagram.com/reel/DauxC6wBaf5/", "plays": 294000, "likes": 1105, "comments": 7, "followers": 15000, "ratio": 19.6, "ageH o.higashiosaka", "text": "", "permalink": "https://www.instagram.com/reel/DcpLHOjPHLm/", "plays": 37000, "likes": 146, "comments": 0, "followers": 6536, "ratio": 5.7, "ageHours": 634.6, "postedAt": "2026-08-30T08:59:42+09:00", "timestampEstimated": true, "genres": ["リンパ"], "hashtags": ["@salon.primo.higashiosaka"], "mods": []}, {"id": "3932358926548695642", "username": "wiz_labo", "text": "院長鍼とオーダーメイド整体🤝🏻\n⁡\n「反り腰だから腰だけ施術」\nではありません︎︎︎︎︎︎☑️\n\n現在のお身体の状態を評価し、\nなぜ反り腰になっているのか\n原因を一つひとつ確認していきます。\n\n評価の結果、腰だけでなく\n足首の動きやバランスも影響していることが分かりました✍️\n\n宮崎先生によるオーダーメイド整体で\n全身のバランスを整え、\n院長と状態を共有しながら院長鍼も組み合わせて施術。\n\n施術後は、施術前と比べて動きの変化が見られました✨\n⁡\n\nWIZでは、\nお一人おひとりのお身体の状態をしっかり評価し、\nその方に合わせた施術をご提案しています😊\n\n気になる症状がある方は、お気軽にご相談ください📩\n\n⁡岐阜県本巣市にあるWIZ鍼灸整骨院では、\nオーダーメイドでの鍼灸・整体を行っております✨️\n\n自律神経を整える鍼治療、\n運動パフォーマンス向上を目的とした整体・運動療法、\n鍼治療を行わずしっかりとした圧の施術、\nそれぞれ得意分野の異なる施術者が\n在籍しております。\n\n症状やご希望に合わせてこちらで\nご提案も可能ですので、\nご不安な点がございましたら\nお気軽にご相談ください🍀\n#整骨院 #鍼灸院 #接骨院 #本巣 #WIZ鍼灸整骨院", "permalink": "https://www.instagram.com/reel/DaSi5vyRXpa/", "plays": 310260, "likes": null, "comments": null, "followers": 54000, "ratio": 5.7, "ageHours": 2038.5, "postedAt": "2026-07-02T21:02:15+09:00", "timestampEstimated": true, "genres": ["鍼灸"], "hashtags": ["鍼灸院"], "mods": ["手技"]}, {"id": "DWqerrFE2Rl", "username": "navimedical_miku", "text": "", "permalink": "https://www.instagram.com/reel/DWqerrFE2Rl/", "plays": 2777, "likes": 7, "comments": 0, "followers": 259, "ratio": 5.6, "ageHours": 4201.5, "postedAt": "2026-04-03T18:01:34+09:00", "timestampEstimated": true, "genres": ["アートメイク"], "hashtags": ["@navimedical_miku"], "mods": []}, {"id": "DdV_pJVpWNi", "username": "kanna_pilates", "text": "", "permalink": "https://www.instagram.com/reel/DdV_pJVpWNi/", "plays": 90000, "likes": 451, "comments": 8, "followers": 16000, "ratio": 5.6, "ageHours": 216.8, "postedAt": "2026-09-16T18:45:18+09:00", "timestampEstimated": true, "genres": ["ピラティス"], "hashtags": ["@kanna_pilates"], "mods": []}, {"id": "DdlXamhvCb9", "username": "haru <script>
(function () {
  var readJSON = function (id) { return JSON.parse(document.getElementById(id).textContent); };
  var POSTS = readJSON('data');
  var GENRES = readJSON('genre-list');
  var MODIFIERS = readJSON('modifier-list');
  var SUMMARY = readJSON('summary-data');
  var RISING = 85.1;   // 伸び率の上位10%にあたる値

  var activeGenres = new Set();
  var activeMods = new Set();   // 掛け合わせ語。ジャンルとはANDで効かせる
  var els = {
    sort: document.getElementById('sort'),
    period: document.getElementById('period'),
    q: document.getElementById('q'),
    genres: document.getElementById('genres'),
    modifiers: document.getElementById('modifiers'),
    list: document.getElementById('list'),
    count: document.getElementById('count'),
    summary: document.getElementById('summary'),
    breakdown: document.getElementById('breakdown')
  };

  function mk(tag, cls, text) {
    var el = document.createElement(tag);
    if (cls) el.className = cls;
    if (text !== undefined) el.textContent = text;
    return el;
  }

  // 文節を1かたまりとして置く。途中で改行されないので、
  // 「を」「と」などの助詞が行頭に来ることがなくなる。
  function phrases(parent, list) {
    list.forEach(function (t) { parent.appendChild(mk('span', 'nb', t)); });
    return parent;
  }

  // --- 集計 ---
  // タイルは必ず4枚。ジャンルはここに混ぜず、下の棒グラフで見せる。
  (function renderSummary() {
    var tiles = [
      ['表示中のリール', SUMMARY.total, '件'],
      ['直近7日のリール', SUMMARY.thisWeek, '件'],
      ['伸び率100倍超', SUMMARY.overRatio, '件'],
      ['アカウント', SUMMARY.authors, '件']
    ];
    tiles.forEach(function (t) {
      var box = mk('div', 'stat');
      box.appendChild(mk('span', 'stat-label', t[0]));
      var v = mk('div', 'stat-value', t[1].toLocaleString());
      v.appendChild(mk('span', 'unit', t[2]));
      box.appendChild(v);
      els.summary.appendChild(box);
    });
  })();

  // --- ジャンル別の内訳 ---
  // 棒の長さは最多ジャンルを100%とした相対値。1つの投稿が複数ジャンルに
  // 入ることがあり、合計が総数と一致しないため、全体に対する割合としては見せない。
  (function renderBreakdown() {
    if (!SUMMARY.genres.length) { els.breakdown.remove(); return; }

    els.breakdown.appendChild(mk('p', 'breakdown-title', 'ジャンル別'));
    var max = SUMMARY.genres.reduce(function (m, p) { return Math.max(m, p[1]); }, 0);

    // 長いジャンル名は固定幅の列に1行では収まらない。
    // 「・」の位置だけで折り、カタカナ語の途中では絶対に割らない。
    function nameParts(name) {
      var parts = name.split('・');
      return parts.map(function (t, i) {
        // 「・」は前の語にくっつける。行頭に落とさないため
        return i < parts.length - 1 ? t + '・' : t;
      });
    }

    SUMMARY.genres.forEach(function (pair) {
      var row = mk('div', 'bar-row');
      if (pair[1] === 0) row.classList.add('pending');
      row.appendChild(phrases(mk('span', 'bar-name'), nameParts(pair[0])));

      var track = mk('div', 'bar-track');
      var fill = mk('div', 'bar-fill');
      fill.style.width = (max > 0 ? (pair[1] / max) * 100 : 0) + '%';
      track.appendChild(fill);
      row.appendChild(track);

      // 数字は出さない。棒の長さで強弱は足りる。
      // まだ集まっていないものだけ、空の棒の理由が分かるよう言葉を添える
      row.appendChild(mk('span', 'bar-count', pair[1] === 0 ? '収集待ち' : ''));
      els.breakdown.appendChild(row);
    });
  })();

  // 何件のうち何件を見ているのかを明示する。
  // 「最終収集」は実際に収集した時刻。HTMLを作り直しただけでは進まない。
  (function renderStamp() {
    var stamp = document.getElementById('stamp');
    var collectedAt = SUMMARY.updatedAt || '2026-09-25 19:33';
    var units = ['最終収集 ' + collectedAt];
    if (SUMMARY.archived > SUMMARY.total) {
      units.push('　/　蓄積 ' + SUMMARY.archived.toLocaleString() + ' 件のうち ');
      units.push(SUMMARY.total.toLocaleString() + ' 件を表示');
    }
    phrases(stamp, units);
  })();

  // --- 絞り込みのチップ（2段構え） ---
  // 上段: 主ジャンル。単独で検索して意味のある語。
  // 下段: 掛け合わせ語。「経営」「メニュー」のように単独だと飲食や一般ビジネスを
  //       拾ってしまう語で、本文に該当語があるかで絞る。
  // どちらも対象を全部並べる。今日まだ回っていないものを隠すと、
  // 扱う範囲が狭まったように見えるため。
  var chipStates = [];

  function makeChip(row, label, onActivate) {
    var b = mk('span', 'chip');
    b.appendChild(mk('span', 'chip-name', label));
    if (onActivate) {
      b.tabIndex = 0;
      b.setAttribute('role', 'button');
      b.addEventListener('click', onActivate);
      b.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onActivate(); }
      });
    } else {
      // 1件も無いので押しても何も起きない。操作対象から外す
      b.classList.add('pending');
      b.setAttribute('aria-disabled', 'true');
      b.title = '該当する投稿がまだありません';
    }
    row.appendChild(b);
    return b;
  }

  function syncChips() {
    chipStates.forEach(function (s) {
      var on = s.isOn();
      s.el.classList.toggle('on', on);
      s.el.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
  }

  // 選んだ集合を切り替えるチップを1つ作る。上段と下段で作りが同じなのでまとめる
  function addToggleChip(row, name, active) {
    var chip = makeChip(row, name, function () {
      if (active.has(name)) active.delete(name);
      else active.add(name);
      syncChips();
      render();
    });
    chipStates.push({ el: chip, isOn: function () { return active.has(name); } });
  }

  function addAllChip(row, active) {
    var chip = makeChip(row, 'すべて', function () {
      active.clear();
      syncChips();
      render();
    });
    chipStates.push({ el: chip, isOn: function () { return active.size === 0; } });
  }

  addAllChip(els.genres, activeGenres);
  GENRES.forEach(function (pair) {
    if (pair[1] === 0) { makeChip(els.genres, pair[0], null); return; }
    addToggleChip(els.genres, pair[0], activeGenres);
  });

  if (MODIFIERS.length === 0) {
    els.modifiers.remove();
  } else {
    addAllChip(els.modifiers, activeMods);
    MODIFIERS.forEach(function (pair) {
      if (pair[1] === 0) { makeChip(els.modifiers, pair[0], null); return; }
      addToggleChip(els.modifiers, pair[0], activeMods);
    });
  }

  syncChips();

  function fmtAge(h) {
    if (h === null || h === undefined) return '不明';
    if (h < 24) return Math.round(h) + '時間前';
    return Math.round(h / 24) + '日前';
  }

  function filtered() {
    var days = parseInt(els.period.value, 10);
    var q = els.q.value.trim().toLowerCase();

    return POSTS.filter(function (p) {
      if (days > 0) {
        if (p.ageHours === null || p.ageHours > days * 24) return false;
      }
      if (activeGenres.size > 0) {
        var hit = p.genres.some(function (g) { return activeGenres.has(g); });
        if (!hit) return false;
      }
      // 掛け合わせはジャンルとAND。「オンライン秘書」かつ「経営」を出すため。
      // 掛け合わせ語どうしはOR（複数選ぶと候補が広がる）
      if (activeMods.size > 0) {
        var mods = p.mods || [];
        var hitMod = mods.some(function (m) { return activeMods.has(m); });
        if (!hitMod) return false;
      }
      if (q) {
        var hay = (p.text + ' ' + p.username).toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    });
  }

  function sorted(rows) {
    var mode = els.sort.value;
    var copy = rows.slice();
    // 取れていない値は必ず末尾に回す。0 として上位に混ぜない
    function desc(get) {
      return function (a, b) {
        var x = get(a), y = get(b);
        if (x === null && y === null) return 0;
        if (x === null) return 1;
        if (y === null) return -1;
        return y - x;
      };
    }
    if (mode === 'plays') copy.sort(desc(function (p) { return p.plays; }));
    else if (mode === 'newest') copy.sort(function (a, b) {
      var av = a.ageHours === null ? Infinity : a.ageHours;
      var bv = b.ageHours === null ? Infinity : b.ageHours;
      return av - bv;
    });
    else copy.sort(desc(function (p) { return p.ratio; }));
    return copy;
  }

  function render() {
    var rows = sorted(filtered());
    els.count.textContent = rows.length + ' 件を表示';
    els.list.textContent = '';

    if (rows.length === 0) {
      // 「絞り込みを」を1かたまりにして、「を」が行頭に来ないようにする
      els.list.appendChild(phrases(mk('div', 'empty'), [
        '条件に合うリールが', 'ありません。', '絞り込みを', '緩めてください。'
      ]));
      return;
    }

    var frag = document.createDocumentFragment();
    rows.forEach(function (p, i) {
      var isRising = p.ratio !== null && p.ratio >= RISING;
      var card = mk('div', 'card' + (isRising ? ' rising' : ''));

      var head = mk('div', 'card-head');
      head.appendChild(mk('span', 'rank', String(i + 1)));
      head.appendChild(mk('span', 'user', '@' + p.username));
      if (isRising) head.appendChild(mk('span', 'badge', '伸び中'));

      // 数値が取れていないときに 0 を出すと「0だった」と読めてしまう。
      // 取れなかったことが分かる形にする
      function num(v) { return v === null || v === undefined ? '—' : v.toLocaleString(); }

      var stats = mk('div', 'stats');
      stats.appendChild(mk('span', 'likes', p.ratio === null ? '伸び率 —' : '×' + p.ratio));
      stats.appendChild(mk('span', 'vel', num(p.plays) + ' 再生'));
      // 取れた時刻と、投稿番号から復元した時刻を同じ顔で見せない
      stats.appendChild(mk('span', 'age',
        fmtAge(p.ageHours) + (p.timestampEstimated ? '（およそ）' : '')));
      head.appendChild(stats);
      card.appendChild(head);

      var metrics = mk('div', 'metrics');
      [['いいね', p.likes], ['コメント', p.comments], ['フォロワー', p.followers]]
        .forEach(function (m) {
          metrics.appendChild(mk('span', 'metric', m[0] + ' ' + num(m[1])));
        });
      card.appendChild(metrics);

      card.appendChild(mk('p', 'text', p.text));

      var tags = mk('div', 'tags');
      // 上下2段のチップと同じ「ジャンル＋掛け合わせ」を出す。
      // 検索語そのものを出すと、「オンライン秘書」と「オンライン秘書 経営」が
      // 並んで冗長になり、1ジャンル1語のときは同じ語が二重に出る
      var seenTags = {};
      p.genres.concat(p.mods || []).forEach(function (t) {
        if (seenTags[t]) return;
        seenTags[t] = true;
        tags.appendChild(mk('span', 'tag', t));
      });
      // 自前で組み立てた instagram.com のURLのはず。そうでないものは
      // href を付けない（javascript: などを踏ませない）
      if (p.permalink && p.permalink.indexOf('https://www.instagram.com/') === 0) {
        var a = mk('a', 'link', 'リールを開く →');
        a.href = p.permalink;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        tags.appendChild(a);
      }
      card.appendChild(tags);
      frag.appendChild(card);
    });
    els.list.appendChild(frag);
  }

  [els.sort, els.period].forEach(function (el) {
    el.addEventListener('change', render);
  });
  els.q.addEventListener('input', render);

  render();
})();
</script>
