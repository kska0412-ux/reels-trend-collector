<style>
  /* 明るい側を基準に全トークンを定義する。暗い側は下で上書きする。 */
  :root {
    --bg: #f6f4f5;
    --surface: #ffffff;
    --surface-2: #fbf9fa;
    --ink: #231c22;
    --muted: #6f636c;
    --border: #e4dee2;
    --accent: #8b2f5f;
    --accent-soft: #f7e9f0;
    --rising: #0f7b6c;
    --rising-soft: #e2f2ef;
    --chip: #efeaed;
    --focus: #8b2f5f;
  }
  /* OS が暗いとき。ただし閲覧者が明るいテーマを選んでいたらそちらを優先する。 */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #151114;
      --surface: #1f1a1e;
      --surface-2: #241e23;
      --ink: #f0eaee;
      --muted: #a3969e;
      --border: #332b31;
      --accent: #e086b0;
      --accent-soft: #3a2130;
      --rising: #4fc3ae;
      --rising-soft: #16332e;
      --chip: #2c2429;
      --focus: #e086b0;
    }
  }
  /* 閲覧者が暗いテーマを選んだとき。OS の設定に関係なく効かせる。 */
  :root[data-theme="dark"] {
    --bg: #151114;
    --surface: #1f1a1e;
    --surface-2: #241e23;
    --ink: #f0eaee;
    --muted: #a3969e;
    --border: #332b31;
    --accent: #e086b0;
    --accent-soft: #3a2130;
    --rising: #4fc3ae;
    --rising-soft: #16332e;
    --chip: #2c2429;
    --focus: #e086b0;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    /* 透明のままだと閲覧側の地の色を借りてしまうので必ず塗る */
    background: var(--bg);
    color: var(--ink);
    /* 日本語本文はWebフォントを落とすと重いので、端末のフォントを使う */
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP",
                 -apple-system, BlinkMacSystemFont, "Yu Gothic Medium", sans-serif;
    line-height: 1.75;
    font-feature-settings: "palt" 1;
    word-break: normal;
    overflow-wrap: break-word;
    line-break: strict;
  }

  .wrap { max-width: 880px; margin: 0 auto; padding: 40px 20px 96px; }

  :focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
    border-radius: 4px;
  }

  /* --- 見出し --- */
  h1 {
    font-family: "Zen Old Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
    font-weight: 900;
    font-size: clamp(1.5rem, 4vw, 2.1rem);
    line-height: 1.35;
    letter-spacing: .01em;
    margin: 0;
    text-wrap: balance;
  }
  /* 対象ジャンルの但し書き。名前より一段弱く見せる */
  .ver {
    display: block;
    font-family: "Hiragino Sans", "Noto Sans JP", sans-serif;
    font-weight: 400;
    font-size: .74rem;
    letter-spacing: .02em;
    color: var(--muted);
    margin-top: 6px;
  }

  /* --- 集計：詳細より先に全体像を出す --- */
  .panel {
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    background: var(--surface);
    margin: 28px 0 8px;
  }
  /* 4枚で固定する。auto-fit だと枚数によって最後の1枚だけ次の行に
     取り残され、空いた枠が塗り残しに見えてしまうため。 */
  .summary {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1px;
    background: var(--border);
  }
  @media (max-width: 620px) {
    /* 4枚なので2列でもきれいに埋まる */
    .summary { grid-template-columns: repeat(2, 1fr); }
  }
  .stat { background: var(--surface); padding: 14px 16px; }

  /* --- ジャンル別の内訳 --- */
  /* 棒にしておけば、ジャンルが何個あっても1行1本で並ぶので取り残しが出ない */
  .breakdown { padding: 15px 16px 17px; border-top: 1px solid var(--border); }
  .breakdown-title {
    font-size: .7rem; color: var(--muted); letter-spacing: .06em;
    margin: 0 0 11px; white-space: nowrap;
  }
  /* 名前の列は固定幅。名前に合わせて伸ばすと、長いジャンルの行だけ棒の
     開始位置がずれて、棒どうしの長さを目で比べられなくなる。
     収まらない名前は「・」の位置で折る（折り位置は .nb で決め打ち）。
     幅と高さは実際のジャンル名から build_html.py が計算して埋める。 */
  .bar-row {
    display: grid;
    grid-template-columns: 11.5em 1fr auto;
    gap: 12px; align-items: center;
  }
  .bar-row + .bar-row { margin-top: 8px; }
  /* 1行で収まる名前も2行の名前と同じ高さにする。混ざると行の間隔が
     ばらついて、棒の並びが読みにくくなる。
     flex にしているのは、折り返した2行をまとめて上下中央に置くため。 */
  .bar-name {
    font-size: .76rem; line-height: 1.4;
    min-height: 1.4em;
    display: flex; flex-wrap: wrap; align-content: center;
  }
  .bar-track {
    height: 6px; border-radius: 999px;
    background: var(--chip); overflow: hidden;
  }
  .bar-fill { height: 100%; border-radius: 999px; background: var(--accent); }
  .bar-count {
    font-family: "Roboto Mono", ui-monospace, monospace;
    font-size: .74rem; color: var(--muted);
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  @media (max-width: 620px) {
    /* 幅は変えない。変えると狭い画面だけ折り返し位置が変わってしまう */
    .bar-row { gap: 9px; }
  }
  /* まだ集まっていないジャンル。対象には入っているので消さず、弱く見せる */
  .bar-row.pending .bar-name { color: var(--muted); }
  .bar-row.pending .bar-track { opacity: .55; }
  /* 「収集待ち」は日本語なので、等幅フォントに任せず本文と同じ書体で出す */
  .bar-row.pending .bar-count {
    font-family: "Hiragino Sans", "Noto Sans JP", sans-serif;
    font-size: .7rem;
  }
  .stat-label {
    font-size: .7rem; color: var(--muted); letter-spacing: .06em;
    display: block; margin-bottom: 4px;
    /* 「表示中/の投稿」のように助詞で割れないよう、まとめて扱う */
    white-space: nowrap;
  }
  .stat-value {
    white-space: nowrap;
    font-family: "Roboto Mono", ui-monospace, monospace;
    font-size: 1.25rem; font-weight: 700;
    font-variant-numeric: tabular-nums;
    line-height: 1.2;
  }
  .stat-value .unit { font-size: .72rem; font-weight: 400; color: var(--muted); margin-left: 3px; }
  .stamp {
    font-family: "Roboto Mono", ui-monospace, monospace;
    font-size: .7rem; color: var(--muted); margin: 0 0 26px;
  }

  /* --- 操作バー --- */
  .controls {
    position: sticky; top: 0; z-index: 10;
    background: var(--bg);
    padding: 12px 0 14px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 18px;
  }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .row + .row { margin-top: 8px; }
  select, input[type=search] {
    font: inherit; font-size: .82rem;
    padding: 7px 11px;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: var(--surface);
    color: var(--ink);
  }
  input[type=search] { flex: 1; min-width: 180px; }
  .chip {
    display: inline-flex; align-items: baseline; gap: 6px;
    font-size: .78rem; padding: 5px 13px;
    border: 1px solid var(--border); border-radius: 999px;
    background: var(--surface); color: var(--muted);
    cursor: pointer; user-select: none;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  .chip.on {
    background: var(--accent-soft); border-color: var(--accent);
    color: var(--accent); font-weight: 700;
  }
  /* どちらの行を押しているのか分かるようにする。2段になると迷いやすい */
  .filter-label {
    font-size: .7rem; color: var(--muted); letter-spacing: .04em;
    white-space: nowrap; min-width: 5.5em;
  }
  /* ジャンル名は途中で割らない。「ダイエット」を「ダイ」と「エット」に分けない */
  .chip-name { white-space: nowrap; }
  /* まだ1件も無いジャンル。押しても空振りするので、選べないことを見た目で示す */
  .chip.pending {
    opacity: .45; cursor: default;
    border-style: dashed;
  }
  .chip.pending:hover { border-color: var(--border); color: var(--muted); }
  .count {
    white-space: nowrap;
    font-family: "Roboto Mono", ui-monospace, monospace;
    color: var(--muted); font-size: .76rem; margin-bottom: 14px;
    font-variant-numeric: tabular-nums;
  }

  /* --- カード --- */
  #list { display: flex; flex-direction: column; gap: 10px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid transparent;
    border-radius: 10px;
    padding: 16px 18px;
  }
  /* 伸びが速い投稿は左端の色で一目で分かるようにする */
  .card.rising { border-left-color: var(--rising); background: var(--surface-2); }

  .card-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 9px; }
  .rank {
    font-family: "Roboto Mono", ui-monospace, monospace;
    font-size: .74rem; color: var(--muted);
    font-variant-numeric: tabular-nums; min-width: 2.4em;
  }
  .user { font-weight: 700; font-size: .86rem; }
  .badge {
    white-space: nowrap;
    font-size: .66rem; font-weight: 700; letter-spacing: .04em;
    padding: 2px 8px; border-radius: 999px;
    background: var(--rising-soft); color: var(--rising);
  }
  .stats {
    margin-left: auto; display: flex; gap: 11px;
    font-family: "Roboto Mono", ui-monospace, monospace;
    font-size: .74rem; font-variant-numeric: tabular-nums;
  }
  /* 数字と単位を離さない。「120,000」と「再生」が割れると読めなくなる */
  .likes { color: var(--accent); font-weight: 700; white-space: nowrap; }
  /* 再生・いいね・コメント・フォロワー。数字と単位を離さない */
  .metrics {
    display: flex; flex-wrap: wrap; gap: 12px;
    font-size: .74rem; color: var(--muted); margin: 0 0 8px;
    font-variant-numeric: tabular-nums;
  }
  .metric { white-space: nowrap; }
  .vel { color: var(--rising); font-weight: 500; white-space: nowrap; }
  .age { color: var(--muted); white-space: nowrap; }

  .text {
    white-space: pre-wrap;
    /* word-break: break-word は単語の途中で割るので使わない。
       overflow-wrap なら、1語が行に収まらないときだけ割る。
       line-break: strict で日本語の禁則処理を厳しい方に寄せる。 */
    word-break: normal;
    overflow-wrap: break-word;
    line-break: strict;
    font-size: .92rem; margin: 0 0 12px;
  }

  /* 文節のかたまり。ここで囲った範囲は途中で改行されない。
     「を」「と」などの助詞が行頭に来るのを防ぐために使う。 */
  .nb { white-space: nowrap; }

  .tags { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .tag {
    white-space: nowrap;
    font-size: .7rem; padding: 3px 9px; border-radius: 4px;
    background: var(--chip); color: var(--muted);
  }
  .link {
    margin-left: auto; font-size: .76rem; color: var(--accent);
    text-decoration: none; font-weight: 700; white-space: nowrap;
  }
  .link:hover { text-decoration: underline; }

  .empty { text-align: center; color: var(--muted); padding: 64px 20px; font-size: .88rem; }
</style>

, "postedAt": "", "timestampEstimated": false, "genres": ["リンパ"], "hashtags": ["@salon.leo_indiba"], "mods": []}, {"id": "3916395036172123276", "username": "bishukan_mama", "text": "更年期というと女性のイメージが強いですが、\n\n実は男性にも更年期があります。\n\n女性は閉経前後に症状が強く出やすく、\n\n男性は40代以降にゆっくり進行するのが特徴。\n\n✔ 疲れやすい\n\n✔ イライラする\n\n✔ やる気が出ない\n\n✔ 眠れない\n\n✔ 体型が変わった\n\n年齢のせいと思っていた不調が、\n\n更年期のサインかもしれません。\n\nあなたやご家族に当てはまるものはありましたか？\n\n保存して後で見返してください😊\n\n@bishukan_mama ←他の健康習慣はこちら💁‍♀️\n\n#更年期 #男性更年期 #女性更年期 #更年期障害 #健康習慣 40代女性 50代女性 40代男性 50代男性 アンチエイジング 健康第一 ホルモンバランス 美習慣ママ 健康豆知識 不調改善", "permalink": "https://www.instagram.com/reel/DZZ1IkTJHyM/", "plays": 2289129, "likes": null, "comments": null, "followers": 12000, "ratio": 190.8, "ageHours": 2319.7, "postedAt": "2026-06-10T20:24:51+09:00", "timestampEstimated": true, "genres": ["更年期ケア"], "hashtags": ["更年期", "更年期障害"], "mods": []}, {"id": "3914873308248427285", "username": "yurutto_kenkou_life", "text": "その謎の不調、実は閉経が近いサインかも…🥺\n\n​閉経の前後10年間は、心と体が次のステージへ\n向けて大きくシフトチェンジする大切な時期。\n見落としがちなリアルな変化をチェックしてみてね！\n\n​🚨 見落としがちな初期サイン12選\n​1. 異常に氷が食べたくなる\n女性ホルモン（エストロゲン）が減って生理が乱れると、隠れ貧血になりやすいの。脳への血流が減って体温調節が狂うと、なぜか口を冷やしたくなって氷をガリガリ欲しくなるんだって！🧊\n\n​2. 朝起きたときに手の指が強張る・痛む\nエストロゲンには関節の炎症を抑える役目があるの。これが急に減ることで関節がスムーズに動かなくなって、特に朝方に指が曲がりにくくなったり痛んだりするよ💦\n\n​3. ドライアイや口の渇きがひどい\n実は目や口、肌に潤いを与えているのもエストロゲン。分泌が減ると全身の粘膜の水分キープ力が一気に落ちるから、目がゴロゴロしたり口が渇きやすくなったりするの😢\n\n​4. 髪がパサつく・抜け毛が増える\n髪のツヤやハリ、成長を支えてくれているのも女性ホルモン。これが減ると髪が細くなったり、頭頂部を中心に全体的な抜け毛が増えたりする原因になるよ。\n\n​5. なぜか皮膚がかゆい\nホルモンが減るとお肌のバリア機能が低下。乾燥のせいで、衣類の擦れとか普段ならなんてことない刺激にもお肌が過敏になって、背中や頭皮が痒くなることがあるの。\n\n​6. 理由もないのに強い不安感に襲われる\nエストロゲンは心の安定を保つ「セロトニン」を作ってくれているの。ホルモンが激減するとセロトニンも減るから、理由がないのに急に不安や焦りが爆発することもあるよ💦\n\n​7. 匂いに敏感・自分の体臭が気になる\n自律神経の乱れから嗅覚が過敏になって、匂いに敏感になる人が多いの。あとはホットフラッシュのベタついた汗のせいで、実際に体臭が変わりやすい時期でもあるよ。\n\n​8. トイレの回数が増える（頻尿・尿もれ）\n尿道や骨盤の筋肉をしなやかに保つ力が弱まるから、筋肉が萎縮して硬くなるの。急に強い尿意を感じたり、くしゃみをした拍子にヒヤッとしたりしやすくなるよ。\n\n​9. ぐっすり寝たはずなのに昼間に猛烈な眠気\n夜中に自覚のないほてりや発汗が起きて、睡眠の質が下がっているケースがすごく多いの。脳が休めていないから、日中に耐えがたい眠気がきちゃうんだ🥱\n\n​10. かかとのガサガサが治らない\nお肌の乾燥＆生まれ変わりのサイクルが遅くなるのが原因。特に皮脂腺のないかかとは角質がどんどん硬くなって、クリームを塗ってもひび割れが治りにくくなるよ。\n\n​11. 悲しくないのに涙もろくなる\n脳の視床下部は、ホルモンの司令塔であり感情のコントロールセンター。卵巣の機能が落ちて脳がパニックを起こすから、感情のブレーキが利かなくて涙が出やすくなるの。\n\n​12. 生理の周期が短くなる\n閉経に近づくと、脳が「ホルモン出して！」って焦って卵胞を急いで育ててしまうの。だから周期が遅れるより先に「21〜25日周期」に早まる人が実は多いんだよ💡\n\n​\n​大人の第2章、もっと身軽に楽しもう！✨\n​これらの症状は、体が次の新しいステージへ\n行くために一生懸命がんばっている証拠。\n\n自分を責めずに「私の体、お疲れ様」って\n労ってあげようね🌱\n\n​これからの変化に落ち着いて備えるために、\nまずは【保存】していつでも見返せるように\nしておいてね！\n\n✤··········✤··········✤··········✤··········✤··········✤········✤\nこんにちは😊\n\nこのアカウントでは\n【今日から変われる健康情報】\nを日々お届けしています。\n\nあなたの暮らしに役立つ情報が\n見つかりますように✨\n\n@yurutto_kenkou_life←他の投稿はこちらから\n\nいいね❤️コメント💬フォロー🤗\nとーっても励みになります!\n✤··········✤··········✤··········✤··········✤··········✤········✤\n​#閉経前サイン #更年期 #40代の悩み #プレ更年期 #女性の健康", "permalink": "https://www.instagram.com/reel/DZUbIguzksV/", "plays": 2431326, "likes": null, "comments": null, "followers": 13000, "ratio": 187.0, "ageHours": 2370.1, "postedAt": "2026-06-08T18:01:27+09:00", "timestampEstimated": true, "genres": ["更年期ケア"], "hashtags": ["更年期"], "mods": []}, {"id": "DcnrCoNPII0", "username": "naru.tensyoku", "text": "", "permalink": "https://www.instagram.com/reel/DcnrCoNPII0/", "plays": 525000, "likes": 435, "comments": 1, "followers": 2874, "ratio": 182.7, "ageHours": 401.1, "postedAt": "2026-08-29T19:00:13+09:00", "timestampEstimated": true, "genres": [], "hashtags": ["@naru.tensyoku"], "mods": ["スクール"]}, {"id": "DanMmW4owPz", "username": "megu_kenko25", "text": "", "permalink": "https://www.instagram.com/reel/DanMmW4owPz/", "plays": 988000, "likes": 1549, "comments": 4, "followers": 5529, "ratio": 178.7, "ageHours": 1598.6, "postedAt": "2026-07-10T21:31:25+09:00", "timestampEstimated": true, "genres": ["更年期ケア"], "hashtags": ["@megu_kenko25"], "mods": []}, {"id": "3954890601437144651", "username": "lapis_aoi", "text": "別バージョンも♥✨✨✨\n何度見ても可愛い₍ᐢ •̀ᴗ•́ᐢ₎b♥\n\n#ネイルデザイン#ドットネイル#マグネットネイル#ロングネイル#ワンホンネイル", "permalink": "https://www.instagram.com/reel/DbimAxQMSZL/", "plays": 349206, "likes": null, "comments": null, "follow : 2033.1, "postedAt": "2026-06-22T19:04:02+09:00", "timestampEstimated": true, "genres": ["美容サロン"], "hashtags": ["@angie_haruna"], "mods": []}, {"id": "3973525602756000196", "username": "yayoi.kel_y", "text": "***\n.\n\n何になるかは、最後までのお楽しみ。\n一癖あるニュアンスが好きです🫧\n\n#ニュアンスネイル \n#個性派ネイル \n#ネイルデザイン \n#ネイルチップ \n#奥行きネイル", "permalink": "https://www.instagram.com/reel/DckzHuqMPnE/", "plays": 51231, "likes": null, "comments": null, "followers": 325, "ratio": 102.5, "ageHours": null, "postedAt": "", "timestampEstimated": false, "genres": [], "hashtags": ["ネイルデザイン"], "mods": []}, {"id": "DaAMjsKpjpw", "username": "bishukan_mama", "text": "", "permalink": "https://www.instagram.com/reel/DaAMjsKpjpw/", "plays": 1225000, "likes": 1423, "comments": 40, "followers": 12000, "ratio": 102.1, "ageHours": 1962.1, "postedAt": "2026-06-25T18:00:40+09:00", "timestampEstimated": true, "genres": ["更年期ケア"], "hashtags": ["@bishukan_mama"], "mods": []}, {"id": "3967133474687103487", "username": "mike_healthylife", "text": "今日は「ほてりだけじゃない！更年期に起こる意外な症状10選」のお話 \n\n「更年期＝ほてり・汗」だけだと思っていませんか？\n\n実は更年期って、ほてり以外にも\n「えっ、これも？」と思うような症状が出ることがあります。\n\n☑ 朝、手をグーにしづらい\n☑ 舌がピリピリ・ヒリヒリする\n☑ 歯に異常がないのに痛む\n☑ 喉に何かが引っかかる感じ\n☑ 朝の一歩目でかかとが痛む\n☑ 匂いに敏感になる\n☑ 肌がかゆい・チクチクする\n☑ 味の感じ方が変わる\n☑ 普段の音がやけにうるさく感じる\n☑ 突然、心臓がドキドキする\n\n「これ、更年期と関係あるの？」って思った症状もあるかもしれません。\n\n更年期には、女性ホルモン「エストロゲン」が減ったり、大きく変動したりします。\n\nこのエストロゲンは、女性特有のことだけじゃなく、自律神経や関節、肌や粘膜など、全身のいろんな働きに関わっています。\n\nそのため、ほてりや汗だけじゃなく、関節のこわばりや肌のかゆみ、動悸など、いろんな不調が出ることも。\n\nただし⚠️\n今回紹介した症状は、更年期以外の原因で起こることもあります。\n\n「たぶん更年期だろう」と決めつけず、症状が強い・長く続くときは医療機関に相談してくださいね。\n\n「これ私にもあるかも…」と思ったら、あとで見返せるように保存しておいてね🔖\n………………………………………………………………………\nご覧いただきありがとうございます✨\nこのアカウント @mike_healthylife では\n知らないと損する健康知識を投稿してます✨ \n毎日がちょっと心地よくなるきっかけに\nなりますように♡\n………………………………………………………………………\n#更年期 #不調 #生活習慣 #健康生活", "permalink": "https://www.instagram.com/reel/DcOFuBfSTH_/", "plays": 1315218, "likes": null, "comments": null, "followers": 13000, "ratio": 101.2, "ageHours": 639.6, "postedAt": "2026-08-19T20:33:04+09:00", "timestampEs しょう。\n\n5．まぶたがピクピク痙攣する ➡ 疲れや睡眠不足が続き、体が休息を求めているサイン。 \n💡【対処法】寝る前はスマホを控え、温かい蒸しタオルで目元をゆっくり温めましょう。\n\n6．爪が割れやすい・縦すじが入る ➡ 栄養や血流が不足し、爪にまで影響が出始めているかも。 \n💡【対処法】胃腸にやさしい食事を心がけ、爪の保湿も忘れずに。\n\n7．抜け毛や白髪が急に増えた ➡ 年齢だけでなく、若々しさを支える力が低下しているサインかも。 \n💡【対処法】頭皮をやさしくマッサージし、黒豆やひじきなど黒い食材も意識してみましょう。\n\n8．かかとがガサガサに乾燥・ひび割れる ➡ 冷えとうるおい不足が進んでいるサイン。 \n💡【対処法】足首やお腹を温め、お風呂上がりはしっかり保湿しましょう。\n\n9．舌のふちに歯型がついている ➡ 胃腸が疲れ、余分な水分をため込みやすくなっている状態。 \n💡【対処法】冷たい飲み物を控え、温かいスープや温野菜で胃腸をいたわりましょう。\n\n10．夕方になると顔だけカッカと熱い ➡ 疲れがたまり、体に熱がこもりやすくなっているサイン。 \n💡【対処法】深呼吸をしながらゆっくり過ごし、夕方以降は無理をせずリラックスする時間をつくりましょう。\n\n✨ 「年齢のせいだから…」と我慢しないで\n\n40代からの不調は、体が一生懸命送ってくれているSOSサインかもしれません。\n\nまずは「最近こんなことあったな」と、\n自分の体の声に気づいてあげることがセルフケアの第一歩🌿\n\n当てはまる項目があった方は、ぜひコメントで番号を教えてください😊\n\nあとで見返せるように【保存】もお忘れなく🔖\n\n----------\n2児のアラフォーママ×鍼灸師🌿\n♢忙しくても体は整えられる\n♢東洋医学×ツボケアで回復しやすい身体づくり\n｢今も未来も、心地よく美しく生きたい｣女性へ✨\n----------\n\n#セルフケア #東洋医学 #インナービューティー #更年期 #養生", "permalink": "https://www.instagram.com/reel/DbLGehehBSp/", "plays": 415667, "likes": null, "comments": null, "followers": 5776, "ratio": 72.0, "ageHours": 1264.0, "postedAt": "2026-07-24T20:10:35+09:00", "timestampEstimated": true, "genres": ["更年期ケア"], "hashtags": ["更年期"], "mods": ["手技"]}, {"id": "DcIhSU2R7Ju", "username": "runa.k72", "text": "", "permalink": "https://www.instagram.com/reel/DcIhSU2R7Ju/", "plays": 929000, "likes": 3686, "comments": 17, "followers": 13000, "ratio": 71.5, "ageHours": null, "postedAt": "", "timestampEstimated": false, "genres": ["リンパ"], "hashtags": ["@runa.k72"], "mods": []}, {"id": "DcvVaztTlro", "username": "azusajinshan8", "text": "", "permalink": "https://www.instagram.com/reel/DcvVaztTlro/", "plays": 319000, "likes": 796, "comments": 14, "followers": 4603, "ratio": 69.3, "ageHours": 329.7, "postedAt": "2026-09-01T18:25:12+09:00", "timestampEstimated": true, "genres": ["エステティシャン"], "hashtags": ["@azusajinshan8"], "mods": []}, {"id": "DclTZsYxJWf", "username": "seri_challenge", "text": "", "permalink": "https://www.instagram.com/reel/DclTZsYxJWf/", "plays": 3043000, "likes": 6367, "comments": 833, "followers": 45000, "ratio": 67.6, "ageHours": 423.2, "postedAt": "2026-08-28T20:55:10+09:00", "timestampEstimated": true, "genres": [], "hashtags": ["@seri_challenge"], "mods": ["経営"]}, {"id": "3939180610668810270", "username": "kingkazu.will", "text": "「骨盤が歪んでいる気がする…」\nそんな方は、まずこの30秒ストレッチを試してみてください！\n\nこのストレッチでは、骨盤の前側にある筋肉（股関節の前側・腸腰筋や大腿直筋周辺）を左右均等に伸ばすことで、左右差を減らしやすくなります。\n\n長時間のデスクワークや車の運転、脚を組むクセ、片足重心などが続くと、左右どちらかの筋肉だけが硬くなりやすく、その結果、骨盤が傾いたりねじれたりしやすくなります。\n\nこの状態が続くと…\n・腰痛\n・反り腰\n・猫背\n・股関節の動かしにくさ\n・歩き方のクセ\nなどにつながることもあります。\n\nたった30秒でも、左右対称にしっかり伸ばすことで股関節の動きが出やすくなり、骨盤周りのバランスを整えるきっかけになります。\n\nただし、一度で骨盤が完全に「矯正」されるわけではありません。\n大切なのは、毎日少しずつ続けて左右差を減らしていくことです。\n\n「片方だけ伸びにくい」\n「左右で硬さが違う」\nという方は、その左右差が姿勢の崩れにつながっているサインかもしれません。\n\n保存して、1日1回続けてみてください🔥\n\nみなさんは右と左、どちらが伸びにくかったですか？\n\n#骨盤ストレッチ #姿勢改善 #反り腰改善 #腰痛改善 #ピラティス", "permalink": "https://www.instagram.com/reel/Daqx-UNBVAe/", "plays": 803120, "likes": null, "comments": null, "followers": 12000, "ratio": 66.9, "ageHours": 1565.2, "postedAt": "2026-07-12T06:55:43+09:00", "timestampEstimated": true, "genres": ["ピラティス"], "hashtags": ["ピラティス"], "mods": []}, {"id": "Daxjn74v-i-", "username": "megu_kenko25", "text": "", "permalink": "https://www.instagram.com/reel/Daxjn74v-i-/", "plays": 370000, "likes": 233, "comments": 2, "followers": 5529, "ratio": 66.9, "ageHours": 1502.0, "postedAt": "2026-07-14T22:05:01+09:00", "timestampEstimated": true, "genres": ["更年期ケア"], "hashtags": ["@megu_kenko25"], "mods": []}, {"id": "Daqx-UNBVAe", "username": "kingkazu.will", "text": "", "permalink": "https://www.instagram.com/reel/Daqx-UNBVAe/", "plays": 800000, "likes": 5860, "comments": 10, "followers": 12000, "ratio": 66.7, "ageHours": 1565.2, "postedAt": "2026-07-12T06:55:43+09:00", "timestampEstimated": true, "genres": ["ピラティス"], "hashtags": ["@kingkazu.will"], "mods": []}, {"id": "DXzDsF9NwNV", "username": "_claire_permanent.jewelry", "text": "", "permalink": "https://www.instagram.com/reel/DXzDsF9NwNV/", "plays": 33000, "like ds": []}, {"id": "DYsoInWBkIY", "username": "kingkazu.will", "text": "", "permalink": "https://www.instagram.com/reel/DYsoInWBkIY/", "plays": 425000, "likes": 3535, "comments": 16, "followers": 12000, "ratio": 35.4, "ageHours": 2741.0, "postedAt": "2026-05-24T07:05:26+09:00", "timestampEstimated": true, "genres": ["ピラティス"], "hashtags": ["@kingkazu.will"], "mods": []}, {"id": "3860365967520640140", "username": "repilates_mito", "text": "(@REPILATES_MITO)ピラティススタジオ\n\n「つま先で押してるのに、なんか効かない…」\nそれ、“かかと落ち”が原因かもしれません。\n\nフットワークでつま先をフットバーに乗せたとき、\n動きの中でかかとがストンと落ちていませんか？\n\nこのエラーが起きると👇\n・足首がつぶれる\n・もも前ばかり使う\n・お尻やハムストリングスに入りにくい\n\nせっかく頑張ってるのに、\n使いたいところに効かなくなってしまいます。\n\n正しいポジションは\n「かかとを軽く持ち上げたままキープ」\n\nポイントは👇\n✔ 母指球・小指球で均等に押す\n✔ 足裏のアーチをつぶさない\n✔ かかとは“下げる”ではなく“浮かせておく”\n✔ 押す意識より“引き上げ続ける”意識\n\nほんの少しの違いだけど、\nここが変わるだけで効き方がガラッと変わります。\n\n「効かないな〜」と思ってる人ほど\n一度チェックしてみてくださいね👌\n\n――――――――――\n📍Repilates イオンタウン水戸南店\n💫女性専用マシンピラティススタジオ\n🌿体験レッスン受付中\n――――――――――\n\n#マシンピラティス #水戸ピラティス #イオンタウン水戸南 #姿勢改善 #Repilates", "permalink": "https://www.instagram.com/reel/DWSxmT1EyyM/", "plays": 121961, "likes": null, "comments": null, "followers": 3452, "ratio": 35.3, "ageHours": 4175.0, "postedAt": "2026-03-25T13:05:06+09:00", "timestampEstimated": true, "genres": ["ピラティス"], "hashtags": ["マシンピラティス"], "mods": []}, {"id": "DbPYqWwTq6M", "username": "nidone_dryheadspa", "text": "", "permalink": "https://www.instagram.com/reel/DbPYqWwTq6M/", "plays": 26000, "likes": 44, "comments": 0, "followers": 738, "ratio": 35.2, "ageHours": 1224.0, "postedAt": "2026-07-26T12:06:27+09:00", "timestampEstimated": true, "genres": ["ヘッドスパ"], "hashtags": ["@nidone_dryheadspa"], "mods": []}, {"id": "Dbs1kcUCUjq", "username": "udekiki_no_hogushi", "text": "", "permalink": "https://www.instagram.com/reel/Dbs1kcUCUjq/", "plays": 333000, "likes": 643, "comments": 0, "followers": 9487, "ratio": 35.1, "ageHours": 949.5, "postedAt": "2026-08-06T22:37:01+09:00", "timestampEstimated": true, "genres": ["ヘッドスパ"], "hashtags": ["@udekiki_no_hogushi inai_gohan_life", "text": "", "permalink": "https://www.instagram.com/reel/Dc7HnvUz4BS/", "plays": 158000, "likes": 432, "comments": 23, "followers": 5767, "ratio": 27.4, "ageHours": 219.9, "postedAt": "2026-09-06T08:15:31+09:00", "timestampEstimated": true, "genres": ["更年期ケア"], "hashtags": ["@murishinai_gohan_life"], "mods": []}, {"id": "Dcn34mzCtwV", "username": "tama_appearancebeauty", "text": "", "permalink": "https://www.instagram.com/reel/Dcn34mzCtwV/", "plays": 655000, "likes": 4946, "comments": 43, "followers": 24000, "ratio": 27.3, "ageHours": 399.3, "postedAt": "2026-08-29T20:52:26+09:00", "timestampEstimated": true, "genres": ["育毛"], "hashtags": ["@tama_appearancebeauty"], "mods": []}, {"id": "3939220126041940873", "username": "murishinai_gohan_life", "text": "「最近なんだか調子が悪い…」\nそれは更年期症状かもしれません。\n\nでも、もしその不調で\n✅仕事に行けない\n✅家事ができない\n✅外出するのもつらい\n\nなど日常生活に支障が出ているなら「更年期障害」の可能性もあります。\n\n更年期症状と更年期障害は同じように思われがちですが、大きな違いは「生活への影響の大きさ」です。\n\nつらいときは「もう少し我慢しよう」と一人で抱え込まず、婦人科などの医療機関に相談することも大切な選択肢😊\n\n食事や運動などのセルフケアも大切ですが、必要なときは医療の力を借りることも、自分を大切にすることにつながります🌻\n\n📌保存して、つらいときの目安にしてください。\n\n💬「更年期症状」と「更年期障害」の違い、知っていましたか？\n\n#更年期 #更年期障害 #40代50代 #健康習慣 #更年期ケア", "permalink": "https://www.instagram.com/reel/Daq69VwzKOJ/", "plays": 157658, "likes": null, "comments": null, "followers": 5767, "ratio": 27.3, "ageHours": 1563.9, "postedAt": "2026-07-12T08:14:14+09:00", "timestampEstimated": true, "genres": ["更年期ケア"], "hashtags": ["更年期障害"], "mods": []}, {"id": "3953426853381661660", "username": "andoanbeauty", "text": "【「なったもんは治る！」 名医の一言で、自分の体が信じられるようになった】\n\nこんばんは！\n\n『東洋医学×アロマ』施術とセラピスト養成講座\n\nセラピスト歴30年の坂田知寿子です。\n\nーーーーーーーーーーーーーーーーー\n\n普段は、京都府長岡京市でカウンセリング鍼灸治療院を営まれている安藤先生。\n\n鳥取には2ヶ月に1度、治療と講座で当サロン\n\n『安藤庵Beauty＋』に来てくれています。\n\n不調が出たり、ちょっと調子が崩れたりすると、どうしても不安になったり、\n\n「どうしよう…」って焦ってしまいますよね。\n\n​でも、先生はいつもどんと構えて、\n\n『なったもんは治る！』\n\nそう言って笑ってくれるんです。\n\n​その言葉を聞くだけで、\n凝り固まっていた心も体も、スッと緩んでいくのが分かります。\n\n「あ、自分の体ってちゃんと元に戻る力を持っているんだ」って。\n\n自分の体に自信が持てるようになるんです。\n\n​なかなかキャンセルが出ないことで有名な、大人気の先生。\n\n実は「鍼灸師」さんなのですが : ["リンパ"], "hashtags": ["@junankobo.stretchfactory"], "mods": []}, {"id": "3925831888740689687", "username": "elinaelina1213ery", "text": "・\n【姿勢シリーズ108】\n\n腹筋が弱いからできない？\n本当のカギは肩甲骨！\n\nロールダウンやロールアップが苦手だと、\n「腹筋が弱いから」と思われがちです😇\n\nでも実は、それだけではありません‼︎\n\n今回は、怪我をする前と怪我直後の動きを比較してみました。\n\n片手が使いにくくなると、肩甲骨を前へ広げる動きが出しづらくなります😱\n\n背中も丸まりにくくなり、肩や首にも余分な力が入りやすくなります💦\n\nロールダウンで大切なのは、腹筋だけで頑張ることではなく、肩甲骨からお腹へ繋げること☝️\n\n前鋸筋 → 外腹斜筋🔥\n\nこの繋がりがあることで、身体はしなやかに丸まることができます✨\n\nできない＝筋力不足\nとは限りません😊\n\nどこが使えて、どこが繋がりにくいのか。\nそんな視点で身体を見ると動きがもっと面白くなりますよ😙\n\nなんとなく続く不調や体の使いにくさは、姿勢の崩れから始まっていることも多いです。\nピラティスはただエクササイズをするだけではなく正しい姿勢や正しい体の使い方を学んでいくもの。\nその考え方を大切にしているのがファンクショナルローラーピラティスです！\n\n姿勢が変わると、体の使い方が変わる。体の使い方が変わると、不調が変わる。\n\n「自分の姿勢どうなんだろう？」と思った方はぜひレッスンへ😊\n\n📍代々木上原駅徒歩1分🚶‍♀️‍➡️\n@studiogod\n▪︎月曜日 12:30–13:30 ピラティス（FRP）\n▪︎水曜日 10:00–11:00 ピラティス（FRP）\n▪︎木曜日 13:00–14:00 ピラティス（FRP）\n▪︎金曜日 18:30–19:30（奇数週のみ）ピラティス（FRP）\n\nインストラクター養成講座も開催しています📚\n\n第7期FRPベーシックインストラクター養成講座（計12時間）\n日時：\n2026年8月2日（日）10:00-17:00\n2026年8月9日（日）10:00-17:00\n\n養成校：東京・代々木上原 @studiogod \n\n詳細・お申し込み\nhttps://shop-p3.shop-pro.jp/?pid=191640584\u0026utm_id=97760_v0_s00_e0_tv4\u0026utm_source=ig\u0026utm_medium=social\u0026utm_content=link_in_bio\n※プロフィールURLからチェックできます\n\nできるだけ毎日、\n正しい姿勢×体の不調改善をシェアします💡\n\n質問やリクエストもコメントで大歓迎です💬\n\n#ロールアップ\n#howto\n#ピラティス \n#functional_roller_pilates \n#pilates", "permalink": "https://www.instagram.com/reel/DZ7W02ISicX/", "plays": 118296, "likes": null, "comments": null, "followers": 5694, "ratio": 20.8, "ageHours": 2007.2, "postedAt": "2026-06-23T20:54:12+09:00", "timestampEstimated": true, "genres": ["ピラティス"], "hashtags": ["ピラティス"], "mods": ["スクール"]}, {"id": "DaSi3zHPlu8", "username": "kenichiro.2022", "text": "", "permalink": "https://www.instagram.com/reel/DaSi3zHPlu8/", "plays": 57000, "likes": 438, "comments": 11, "followers": 2735, "ratio": 20.8, "ageHours": 1791.1, "postedAt": "2026-07-02T21:01:59+09:00", "timestampEstimated": true, "genres": [], "hashtags": ["@kenichiro.2022"], "mods": ["単価UP"]}, {"id": " ィス"], "hashtags": ["@personalgym__ideal"], "mods": []}, {"id": "DbvBnTGBS-D", "username": "ucchi_ns3215", "text": "", "permalink": "https://www.instagram.com/reel/DbvBnTGBS-D/", "plays": 88000, "likes": 681, "comments": 11, "followers": 7827, "ratio": 11.2, "ageHours": 929.1, "postedAt": "2026-08-07T19:00:45+09:00", "timestampEstimated": true, "genres": [], "hashtags": ["@ucchi_ns3215"], "mods": ["スクール"]}, {"id": "3895300861888687067", "username": "yurika_yorushoku", "text": "作業ロボット🤖から卒業できた秘密…🤫\n\n「今日はいい日だったな〜」って\nお客さんに帰り道でニヤニヤして欲しい💖\n\n私が15年このお仕事を続けてきて\n一番大切にしているのは、\nこの「帰り道の感情」をゴールにすることです。\n\n実はここに向かうように\nすべてのおもてなしを組み立てます✨\n\n┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈\n🌷 おもてなしのポイント 🌷\n┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈\n\n◆「もし私がお客さんだったら？」と想像する\n入室の瞬間、どんな笑顔なら安心するか、\nどんな声かけならホッとするかをフル回転！\n\n◆「お疲れさま」を心から届ける\n普段褒められることが少ない男性だからこそ、\n心からの「頑張ってますね」という想いを\n演出に込めて接します✨\n\n◆日常を忘れさせる空間づくり\n照明やBGM、自分の見た目まで。\n小さな変化でお客さんを非日常へ連れて行きます🤝\n「ただのマッサージ」を\n「最高のエンタメ」に変えていこう！\n\n━━━━━━━━━━━━━━━\n✨ 演出でギャップを作る方法 ✨\n━━━━━━━━━━━━━━━\n\n🚿 お客さんが準備されている間の「仕込み」\nここで一気に雰囲気を変えて、非日常を作ります！\n\n🕯 照明\n部屋の電気を落として、間接照明でキラキラに✨\n\n🎵 BGM\n落ち着いた大人のBARのようなジャズを流す\n\n👗 衣装\nお出迎えの服から施術着へチェンジ！\n\n👱‍♀️ 見た目\n髪もアップにまとめて印象をガラリと変える\n\n💡 なぜ「ギャップ」が大事なの？\n魅力的な人って「情報量が多い人」なんです。\nそれは知識が多いことではなく、\n「色んな面（ギャップ）」を持っているということ✨\n\n人は単調な人よりも、\n変化がある人に魅力を感じます☺️\nシーンごとに演出を変えることが、\nそのままあなたの魅力を伝えることに繋がるんです🥹✨\n\n技術だけじゃない\nあなただけの「演出」で\nお客さんを最高のゴールへエスコートしよう💖\n\n#セラピスト #接客術 #おもてなし #新人セラピスト\n\n\"music by LUNNA「アリかも？」\"", "permalink": "https://www.instagram.com/reel/DYO437mJevb/", "plays": 146076, "likes": null, "comments": null, "followers": 13000, "ratio": 11.2, "ageHours": 3018.2, "postedAt": "2026-05-12T17:54:30+09:00", "timestampEstimated": true, "genres": ["セラピスト"], "hashtags": ["セラピスト"], "mods": ["スクール"]}, {"id": "Daz3ZfMzxow", "username": "moriharuna71", "text": "", "permalink": "https://www.instagram.com/reel/Daz3ZfMzxow/", "plays": 1493000, "likes": null, "comments": null, "followers": 135000, "ratio": 11.1, "ageHours": 1480.5, "postedAt": "2026-07-15T19:36:17+09:00", "timestamp どにも用いられます。\n\n━━━━━━━━━━━━━━━\n\n同じ「更年期の不調」でも、 症状だけでなく体力や冷え・のぼせなどの体質も\n漢方選びのポイントになります👩‍⚕️\nあとで見返せるように保存がおすすめです🍀\n\n#更年期障害 #緩和ケア #漢方 #ツムラ #健康と医療", "permalink": "https://www.instagram.com/reel/Dc5_-HWxbrJ/", "plays": 46666, "likes": null, "comments": null, "followers": null, "ratio": null, "ageHours": 230.3, "postedAt": "2026-09-05T21:49:25+09:00", "timestampEstimated": true, "genres": ["更年期ケア"], "hashtags": ["更年期障害"], "mods": ["手技"]}]</script>

<script>
(function () {
  var readJSON = function (id) { return JSON.parse(document.getElementById(id).textContent); };
  var POSTS = readJSON('data');
  var GENRES = readJSON('genre-list');
  var MODIFIERS = readJSON('modifier-list');
  var SUMMARY = readJSON('summary-data');
  var RISING = 63.4;   // 伸び率の上位10%にあたる値

  var activeGenres = new Set();
  var activeMods = new Set();   // 掛け合わせ語。ジャンルとはANDで効かせる
  var els = {
    sort: document.getElementById('sort'),
    period: document.getElementById('period'),
    q: document.getElementById('q'),
    genres: document.getElementById('genres'),
    modifiers: document.getElementById('modifiers'),
    list: document.getElementById('list'),
    count: document.getElementById('count'),
    summary: document.getElementById('summary'),
    breakdown: document.getElementById('breakdown')
  };

  function mk(tag, cls, text) {
    var el = document.createElement(tag);
    if (cls) el.className = cls;
    if (text !== undefined) el.textContent = text;
    return el;
  }

  // 文節を1かたまりとして置く。途中で改行されないので、
  // 「を」「と」などの助詞が行頭に来ることがなくなる。
  function phrases(parent, list) {
    list.forEach(function (t) { parent.appendChild(mk('span', 'nb', t)); });
    return parent;
  }

  // --- 集計 ---
  // タイルは必ず4枚。ジャンルはここに混ぜず、下の棒グラフで見せる。
  (function renderSummary() {
    var tiles = [
      ['表示中のリール', SUMMARY.total, '件'],
      ['直近7日のリール', SUMMARY.thisWeek, '件'],
      ['伸び率100倍超', SUMMARY.overRatio, '件'],
      ['アカウント', SUMMARY.authors, '件']
    ];
    tiles.forEach(function (t) {
      var box = mk('div', 'stat');
      box.appendChild(mk('span', 'stat-label', t[0]));
      var v = mk('div', 'stat-value', t[1].toLocaleString());
      v.appendChild(mk('span', 'unit', t[2]));
      box.appendChild(v);
      els.summary.appendChild(box);
    });
  })();

  // --- ジャンル別の内訳 ---
  // 棒の長さは最多ジャンルを100%とした相対値。1つの投稿が複数ジャンルに
  // 入ることがあり、合計が総数と一致しないため、全体に対する割合としては見せない。
  (function renderBreakdown() {
    if (!SUMMARY.genres.length) { els.breakdown.remove(); return; }

    els.breakdown.appendChild(mk('p', 'breakdown-title', 'ジャンル別'));
    var max = SUMMARY.genres.reduce(function (m, p) { return Math.max(m, p[1]); }, 0);

    // 長いジャンル名は固定幅の列に1行では収まらない。
    // 「・」の位置だけで折り、カタカナ語の途中では絶対に割らない。
    function nameParts(name) {
      var parts = name.split('・');
      return parts.map(function (t, i) {
        // 「・」は前の語にくっつける。行頭に落とさないため
        return i < parts.length - 1 ? t + '・' : t;
      });
    }

    SUMMARY.genres.forEach(function (pair) {
      var row = mk('div', 'bar-row');
      if (pair[1] === 0) row.classList.add('pending');
      row.appendChild(phrases(mk('span', 'bar-name'), nameParts(pair[0])));

      var track = mk('div', 'bar-track');
      var fill = mk('div', 'bar-fill');
      fill.style.width = (max > 0 ? (pair[1] / max) * 100 : 0) + '%';
      track.appendChild(fill);
      row.appendChild(track);

      // 数字は出さない。棒の長さで強弱は足りる。
      // まだ集まっていないものだけ、空の棒の理由が分かるよう言葉を添える
      row.appendChild(mk('span', 'bar-count', pair[1] === 0 ? '収集待ち' : ''));
      els.breakdown.appendChild(row);
    });
  })();

  // 何件のうち何件を見ているのかを明示する。
  // 「最終収集」は実際に収集した時刻。HTMLを作り直しただけでは進まない。
  (function renderStamp() {
    var stamp = document.getElementById('stamp');
    var collectedAt = SUMMARY.updatedAt || '2026-09-15 12:07';
    var units = ['最終収集 ' + collectedAt];
    if (SUMMARY.archived > SUMMARY.total) {
      units.push('　/　蓄積 ' + SUMMARY.archived.toLocaleString() + ' 件のうち ');
      units.push(SUMMARY.total.toLocaleString() + ' 件を表示');
    }
    phrases(stamp, units);
  })();

  // --- 絞り込みのチップ（2段構え） ---
  // 上段: 主ジャンル。単独で検索して意味のある語。
  // 下段: 掛け合わせ語。「経営」「メニュー」のように単独だと飲食や一般ビジネスを
  //       拾ってしまう語で、本文に該当語があるかで絞る。
  // どちらも対象を全部並べる。今日まだ回っていないものを隠すと、
  // 扱う範囲が狭まったように見えるため。
  var chipStates = [];

  function makeChip(row, label, onActivate) {
    var b = mk('span', 'chip');
    b.appendChild(mk('span', 'chip-name', label));
    if (onActivate) {
      b.tabIndex = 0;
      b.setAttribute('role', 'button');
      b.addEventListener('click', onActivate);
      b.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onActivate(); }
      });
    } else {
      // 1件も無いので押しても何も起きない。操作対象から外す
      b.classList.add('pending');
      b.setAttribute('aria-disabled', 'true');
      b.title = '該当する投稿がまだありません';
    }
    row.appendChild(b);
    return b;
  }

  function syncChips() {
    chipStates.forEach(function (s) {
      var on = s.isOn();
      s.el.classList.toggle('on', on);
      s.el.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
  }

  // 選んだ集合を切り替えるチップを1つ作る。上段と下段で作りが同じなのでまとめる
  function addToggleChip(row, name, active) {
    var chip = makeChip(row, name, function () {
      if (active.has(name)) active.delete(name);
      else active.add(name);
      syncChips();
      render();
    });
    chipStates.push({ el: chip, isOn: function () { return active.has(name); } });
  }

  function addAllChip(row, active) {
    var chip = makeChip(row, 'すべて', function () {
      active.clear();
      syncChips();
      render();
    });
    chipStates.push({ el: chip, isOn: function () { return active.size === 0; } });
  }

  addAllChip(els.genres, activeGenres);
  GENRES.forEach(function (pair) {
    if (pair[1] === 0) { makeChip(els.genres, pair[0], null); return; }
    addToggleChip(els.genres, pair[0], activeGenres);
  });

  if (MODIFIERS.length === 0) {
    els.modifiers.remove();
  } else {
    addAllChip(els.modifiers, activeMods);
    MODIFIERS.forEach(function (pair) {
      if (pair[1] === 0) { makeChip(els.modifiers, pair[0], null); return; }
      addToggleChip(els.modifiers, pair[0], activeMods);
    });
  }

  syncChips();

  function fmtAge(h) {
    if (h === null || h === undefined) return '不明';
    if (h < 24) return Math.round(h) + '時間前';
    return Math.round(h / 24) + '日前';
  }

  function filtered() {
    var days = parseInt(els.period.value, 10);
    var q = els.q.value.trim().toLowerCase();

    return POSTS.filter(function (p) {
      if (days > 0) {
        if (p.ageHours === null || p.ageHours > days * 24) return false;
      }
      if (activeGenres.size > 0) {
        var hit = p.genres.some(function (g) { return activeGenres.has(g); });
        if (!hit) return false;
      }
      // 掛け合わせはジャンルとAND。「オンライン秘書」かつ「経営」を出すため。
      // 掛け合わせ語どうしはOR（複数選ぶと候補が広がる）
      if (activeMods.size > 0) {
        var mods = p.mods || [];
        var hitMod = mods.some(function (m) { return activeMods.has(m); });
        if (!hitMod) return false;
      }
      if (q) {
        var hay = (p.text + ' ' + p.username).toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    });
  }

  function sorted(rows) {
    var mode = els.sort.value;
    var copy = rows.slice();
    // 取れていない値は必ず末尾に回す。0 として上位に混ぜない
    function desc(get) {
      return function (a, b) {
        var x = get(a), y = get(b);
        if (x === null && y === null) return 0;
        if (x === null) return 1;
        if (y === null) return -1;
        return y - x;
      };
    }
    if (mode === 'plays') copy.sort(desc(function (p) { return p.plays; }));
    else if (mode === 'newest') copy.sort(function (a, b) {
      var av = a.ageHours === null ? Infinity : a.ageHours;
      var bv = b.ageHours === null ? Infinity : b.ageHours;
      return av - bv;
    });
    else copy.sort(desc(function (p) { return p.ratio; }));
    return copy;
  }

  function render() {
    var rows = sorted(filtered());
    els.count.textContent = rows.length + ' 件を表示';
    els.list.textContent = '';

    if (rows.length === 0) {
      // 「絞り込みを」を1かたまりにして、「を」が行頭に来ないようにする
      els.list.appendChild(phrases(mk('div', 'empty'), [
        '条件に合うリールが', 'ありません。', '絞り込みを', '緩めてください。'
      ]));
      return;
    }

    var frag = document.createDocumentFragment();
    rows.forEach(function (p, i) {
      var isRising = p.ratio !== null && p.ratio >= RISING;
      var card = mk('div', 'card' + (isRising ? ' rising' : ''));

      var head = mk('div', 'card-head');
      head.appendChild(mk('span', 'rank', String(i + 1)));
      head.appendChild(mk('span', 'user', '@' + p.username));
      if (isRising) head.appendChild(mk('span', 'badge', '伸び中'));

      // 数値が取れていないときに 0 を出すと「0だった」と読めてしまう。
      // 取れなかったことが分かる形にする
      function num(v) { return v === null || v === undefined ? '—' : v.toLocaleString(); }

      var stats = mk('div', 'stats');
      stats.appendChild(mk('span', 'likes', p.ratio === null ? '伸び率 —' : '×' + p.ratio));
      stats.appendChild(mk('span', 'vel', num(p.plays) + ' 再生'));
      // 取れた時刻と、投稿番号から復元した時刻を同じ顔で見せない
      stats.appendChild(mk('span', 'age',
        fmtAge(p.ageHours) + (p.timestampEstimated ? '（およそ）' : '')));
      head.appendChild(stats);
      card.appendChild(head);

      var metrics = mk('div', 'metrics');
      [['いいね', p.likes], ['コメント', p.comments], ['フォロワー', p.followers]]
        .forEach(function (m) {
          metrics.appendChild(mk('span', 'metric', m[0] + ' ' + num(m[1])));
        });
      card.appendChild(metrics);

      card.appendChild(mk('p', 'text', p.text));

      var tags = mk('div', 'tags');
      // 上下2段のチップと同じ「ジャンル＋掛け合わせ」を出す。
      // 検索語そのものを出すと、「オンライン秘書」と「オンライン秘書 経営」が
      // 並んで冗長になり、1ジャンル1語のときは同じ語が二重に出る
      var seenTags = {};
      p.genres.concat(p.mods || []).forEach(function (t) {
        if (seenTags[t]) return;
        seenTags[t] = true;
        tags.appendChild(mk('span', 'tag', t));
      });
      // 自前で組み立てた instagram.com のURLのはず。そうでないものは
      // href を付けない（javascript: などを踏ませない）
      if (p.permalink && p.permalink.indexOf('https://www.instagram.com/') === 0) {
        var a = mk('a', 'link', 'リールを開く →');
        a.href = p.permalink;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        tags.appendChild(a);
      }
      card.appendChild(tags);
      frag.appendChild(card);
    });
    els.list.appendChild(frag);
  }

  [els.sort, els.period].forEach(function (el) {
    el.addEventListener('change', render);
  });
  els.q.addEventListener('input', render);

  render();
})();
</script>
